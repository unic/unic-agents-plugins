name: unic-dlc-pr-review
description: >
  Generic, self-contained PR review. Fans out seven review aspects (code-quality, test-coverage,
  silent-failure, type-design, comment-rot, code-simplification, and intent/AC-coverage) as parallel
  fresh Archon nodes, each grounded in a shared Intent Brief composed once in prep from the linked work
  items, Confluence/MD docs, the PR description, and PRD.md. Synthesises this run's findings, reconciles
  them against the prior iteration (new / still-present / fixed / regressed), then — after a config-gated
  human confirm — posts/updates one structured summary comment plus inline comments on the current PR via
  the configured tracker (MCP-first, CLI-fallback). Harvests unic-pr-review's review learnings without its
  ADO code or any dependency (ADR-0016/0017). Ported to the key-discriminated node schema (ADR-0011);
  inherits /build's self-contained-node conventions (ADR-0023 §5). See ADR-0026.

# Required at the workflow level so the review-gate approval message reaches the user (ADR-0011).
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config. A prompt node (NOT a script) so it needs
  # no plugin-lib import and no $CLAUDE_PLUGIN_ROOT (ADR-0023 §5): it reads .archon/unic-dlc.config.yaml
  # with its own tools. Posting is AFK-safe; the human checkpoint here is the review-gate, and the real
  # merge gate lives in /qa.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /pr-review workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug (kebab-case).
         If $ARGUMENTS is empty → status "no-slug".
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`                  (default "workflows")
             `gates.pr-review`                (default "hitl")
             `pr-review.confidence_threshold` (default 60)
             `pr-review.inline_comments`      (default true)
             `tracker.type`                   (e.g. github / ado / jira / local-markdown)
             `docs.type` / `docs.access`      (for intent composition from docs)
             `project.branching`              (default "gitflow")
      3. If slug and config are both present → status "ready". (There is no PRD precondition: intent is
         composed from whatever sources resolve — see prep.)

      Compute `expected_base` from branching: "develop" when branching == "gitflow", else "main".
      ALWAYS emit EVERY required field, including in the no-slug / no-config branches, so the object
      validates before `guard-not-ready` can cancel. When a value cannot be read, fall back to: slug ""
      (if no-slug), artifacts_dir "workflows", gate "hitl", confidence_threshold 60, inline_comments
      "true", tracker_type "", branching "gitflow", expected_base "develop". `inline_comments` is emitted
      as the STRING "true"/"false" (enum) so downstream `when` comparisons are reliable. Set `message` to
      a human-readable reason for any non-ready status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        confidence_threshold: { type: number }
        inline_comments:
          type: string
          enum: ['true', 'false']
        tracker_type: { type: string }
        branching: { type: string }
        expected_base: { type: string }
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, confidence_threshold, inline_comments, tracker_type, branching, expected_base, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly (ADR-0011: cancel vs fail).
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /pr-review preconditions not met — see the bootstrap output for whether the slug or
      .archon/unic-dlc.config.yaml is missing. Pass a slug (`/unic-dlc-pr-review <slug>`) and run
      /unic-archon-dlc:setup first if there is no config.

  # ---------------------------------------------------------------------------------------------
  # prep — the shared context builder. Identifies the open PR, computes the diff, categorises the
  # changed files (for the spawn gates), composes ONE Intent Brief from every available source, detects
  # the prior review iteration, and writes everything to <artifacts_dir>/<slug>/pr-review/ so the fanned
  # aspect nodes read it off disk (fresh nodes share no memory — ADR-0012/0015). Composing intent once
  # and injecting it into every aspect is the primary quality lever (ADR-0026): each aspect judges the
  # diff against what the PR is SUPPOSED to do.
  # ---------------------------------------------------------------------------------------------
  - id: prep
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the prep node of /pr-review for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        SESSION       = <ARTIFACTS_DIR>/<SLUG>/pr-review/
        TRACKER       = $bootstrap.output.tracker_type
      Create SESSION if it does not exist.

      ## 1. Identify the open PR + read its description
      Compose the configured tracker (MCP-first, CLI-fallback — never hardcode a host, ADR-0016), reading
      `tracker` from `.archon/unic-dlc.config.yaml`:
        - github → `gh pr view --json number,title,body,headRefName,baseRefName`
        - ado    → `az repos pr list --status active` then `az repos pr show` for the current branch
        - jira / local-markdown / other → there may be no queryable PR; note it and continue.
      Store PR_ID, PR_TITLE, and the PR DESCRIPTION BODY (an intent source).

      ## 2. Compute the diff + categorise changed files
      BASE_REF = the upstream base (merge-base of the PR base branch and HEAD). Try
      `git merge-base origin/$bootstrap.output.expected_base HEAD`; fall back to `HEAD~1`.
      Write the unified diff to `SESSION/diff.patch` (`git diff <BASE_REF>...HEAD`) and the changed-file
      list to `SESSION/changed-files.txt` (`git diff --name-only <BASE_REF>...HEAD`).
      Categorise the changed files into these STRING booleans ("true"/"false"):
        has_source              — any non-test source file (.mjs/.js/.ts/.py/… excluding tests/docs)
        has_tests               — any test file (*.test.*, *.spec.*, test/, tests/, __tests__/)
        has_types               — any type/JSDoc-type change (.ts/.d.ts, or added `@param`/`@returns`/`@type`)
        has_docs                — any .md/.mdx/doc file OR added/removed comment lines
        touches_error_handling  — the diff adds/changes try/catch, `.catch(`, `??`/`||` fallbacks, or early returns on error

      ## 3. Compose ONE Intent Brief (inject into every aspect)
      Gather intent from EVERY source that resolves — none is individually required:
        a. Linked work items — the PR's linked User Story / Bug / Jira ticket (from the PR body, branch
           name, or tracker links). Fetch via the configured tracker (MCP-first, CLI-fallback).
        b. Confluence / MD docs — pages referenced in the work item or PR body, or discoverable via the
           configured docs system-skill (`docs.type`/`docs.access`).
        c. The PR description body (from step 1).
        d. `<ARTIFACTS_DIR>/<SLUG>/PRD.md` if it exists (what /specs wrote).
      Write `SESSION/intent-brief.md`: a short narrative of the intended behaviour + a numbered
      Acceptance Criteria list (AC-1, AC-2, …) distilled across the sources.
      Set `intent_available` = "true" only if at least one source resolved; else "false" (and write a
      one-line brief saying no intent sources were found).
      **Contradictions:** when sources disagree (e.g. the work item says one thing, the PR body another),
      record each as a short string in `contradictions` AND note it at the top of intent-brief.md. Do not
      silently pick a winner.

      ## 4. Detect the prior review iteration
      Scan the PR's existing comments/threads for the hidden marker `<!-- unic-dlc-pr-review:iteration=N -->`
      (match on the MARKER, never on comment author). Take the HIGHEST N found. Set `iteration` = N+1
      (or 1 if none). Parse the prior findings from the prior summary + inline markers
      (`<!-- unic-dlc-pr-review:finding=<hash> -->`) into `prior_findings` (each: hash, aspect, file,
      title) so reconcile can classify against them. If the tracker cannot list comments, set iteration 1
      and prior_findings []. Write `SESSION/prep.json` mirroring the emitted object for durability.

      ALWAYS emit EVERY required field so the object validates (downstream nodes and `prep.json` assume
      they exist). When no PR is queryable, use `pr_id` "" and `pr_title` "". `contradictions` and
      `prior_findings` are ALWAYS arrays — `[]` when there is nothing to report. Emit the structured object.
    output_format:
      type: object
      properties:
        pr_id: { type: string }
        pr_title: { type: string }
        base_ref: { type: string }
        has_source: { type: string, enum: ['true', 'false'] }
        has_tests: { type: string, enum: ['true', 'false'] }
        has_types: { type: string, enum: ['true', 'false'] }
        has_docs: { type: string, enum: ['true', 'false'] }
        touches_error_handling: { type: string, enum: ['true', 'false'] }
        intent_available: { type: string, enum: ['true', 'false'] }
        contradictions: { type: array, items: { type: string } }
        iteration: { type: number }
        prior_findings:
          type: array
          items:
            type: object
            properties:
              hash: { type: string }
              aspect: { type: string }
              file: { type: string }
              title: { type: string }
            required: [hash, aspect, file, title]
      required: [pr_id, pr_title, base_ref, has_source, has_tests, has_types, has_docs, touches_error_handling, intent_available, contradictions, iteration, prior_findings]

  # =============================================================================================
  # ASPECT FAN-OUT — seven parallel fresh nodes, each depends_on [prep]. Every aspect reads the shared
  # SESSION/intent-brief.md (intent-grounded), reads SESSION/diff.patch + SESSION/changed-files.txt, and
  # WRITES its findings to SESSION/findings/<aspect>.json so synthesize reads them off disk (a skipped
  # aspect simply writes nothing — no skipped-node-output reference). Conditional spawn gates
  # (harvested SPAWN_TABLE, biased to over-spawn): code-quality + intent-check always run.
  #
  # Every aspect applies the SAME finding contract:
  #   - Confidence 0–100 → severity: 90–100 critical, 80–89 important, 60–79 minor,
  #     < $bootstrap.output.confidence_threshold → DROP before writing.
  #   - Finding shape: { aspect, severity, confidence, file, line, title (≤80 chars, no trailing period),
  #     body (1–4 sentences), suggestion? (only when a mechanical drop-in fix exists),
  #     hash (stable: sha1-ish of aspect+file+normalised-title, NOT the line number) }
  #   - Calibrate against the Intent Brief: do NOT flag a spec-mandated choice as a defect; DO flag a
  #     documented requirement the diff misses.
  #   - Also collect `positives` (things done well) for the "What's good" section.
  # Write {"findings": [...], "positives": [...]} to SESSION/findings/<aspect>.json.
  # =============================================================================================

  - id: code-quality
    depends_on: [prep]
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: code-quality. Read the shared finding contract from the workflow (severity rubric, finding
      shape, intent calibration). SLUG=$bootstrap.output.slug, SESSION=<artifacts_dir>/<slug>/pr-review/,
      threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt, and the project's
      conventions (CLAUDE.md / AGENTS.md). Review the diff for readability, naming that communicates
      intent, over-long/multi-purpose functions, duplicated logic, and project-convention adherence
      (indentation, quotes, semicolons, early returns). Always runs (baseline aspect). Write
      SESSION/findings/code-quality.json.

  - id: tests
    depends_on: [prep]
    when: "$prep.output.has_tests == 'true'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: tests (test-coverage adequacy). Apply the shared finding contract.
      SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/, threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt. Flag: new branches/
      functions with no test, happy-path-only tests missing sad/edge paths, assertions on implementation
      detail rather than behaviour, mocked internal collaborators (only true external boundaries should
      be mocked), async under test with no rejection assertion, and Acceptance Criteria (from the Intent
      Brief) with no visible test coverage. Write SESSION/findings/tests.json.

  - id: silent-failure
    depends_on: [prep]
    when: "$prep.output.has_source == 'true' || $prep.output.touches_error_handling == 'true'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: silent-failure. Apply the shared finding contract.
      SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/, threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt. Flag: empty catch
      blocks, `.catch(() => {})`, swallowed exceptions (caught + logged but not rethrown/propagated),
      inappropriate `?? default` / `|| fallback` masking missing config or corrupt state, retries that
      exhaust then proceed silently, wrong error-property access, ignored error-signalling return values,
      and lost-signal / observability gaps (a fallback or early-return branch that skips a telemetry /
      analytics / Sentry event the normal path emits — especially one the Intent Brief requires). Write
      SESSION/findings/silent-failure.json.

  - id: type-design
    depends_on: [prep]
    when: "$prep.output.has_types == 'true'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: type-design. Apply the shared finding contract.
      SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/, threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt. Flag: types too wide
      (`any`, `{}`, bare `string` where a union/branded type fits), types admitting illegal states,
      primitive obsession, anemic data-bag types, assertions that should be narrowing guards, missing
      exhaustiveness checks, exposed mutable internals, invariants enforced by convention rather than the
      type/constructor, and (for `.mjs` `// @ts-check` files) missing JSDoc on exported params/returns.
      Write SESSION/findings/type-design.json.

  - id: comment-rot
    depends_on: [prep]
    when: "$prep.output.has_docs == 'true'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: comment-rot. Apply the shared finding contract.
      SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/, threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt. Flag: comments
      describing behaviour the diff changed, JSDoc `@param`/`@returns` mismatching the signature,
      over-documentation restating code, stale TODO/FIXME, markdown docs contradicted by the diff, and
      "temporary/for now" comments the diff makes permanent. Write SESSION/findings/comment-rot.json.

  - id: simplifier
    depends_on: [prep]
    when: "$prep.output.has_source == 'true'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: simplifier (unnecessary complexity). Apply the shared finding contract.
      SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/, threshold=$bootstrap.output.confidence_threshold.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt. Flag: nested
      conditionals flattenable to guard clauses, over-long multi-purpose functions, duplicated logic,
      clever one-liners hurting readability, boolean-flag params, `if (x) return true else return false`,
      needless `async`, `.then` chains that should be `await`, and nested ternaries. Prefer findings that
      preserve behaviour exactly. Write SESSION/findings/simplifier.json.

  - id: intent-check
    depends_on: [prep]
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      Aspect: intent-check (AC-coverage). Apply the shared finding contract for any quality findings, but
      your PRIMARY output is per-AC verdicts. SESSION=<artifacts_dir>/$bootstrap.output.slug/pr-review/.
      Read SESSION/intent-brief.md, SESSION/diff.patch, SESSION/changed-files.txt.
      - If $prep.output.intent_available == "false": write SESSION/findings/intent-check.json as
        {"findings": [], "positives": [], "ac_verdicts": [], "note": "no intent sources"} and stop.
      - Otherwise, for each Acceptance Criterion in the Intent Brief, judge diff coverage and emit a
        verdict: "addressed" | "partially addressed" | "unaddressed" (this is a coverage judgment, not a
        code-quality one). Echo any `contradictions` from prep as findings so they surface in the summary.
      Write SESSION/findings/intent-check.json as
      {"findings": [...], "positives": [...], "ac_verdicts": [{"id","text","verdict"}...]}.

  # ---------------------------------------------------------------------------------------------
  # synthesize — THIS RUN ONLY. Reads every SESSION/findings/<aspect>.json that exists (skipped aspects
  # wrote none), dedupes overlaps, buckets by severity, assigns each finding its stable hash marker, and
  # assembles the severity-grouped body sections + the Intent Check section + the contradictions callout.
  # No prior-iteration awareness here — that is reconcile's job. trigger_rule: all_done so skipped
  # aspects (when=false) do not block it.
  # ---------------------------------------------------------------------------------------------
  - id: synthesize
    depends_on: [code-quality, tests, silent-failure, type-design, comment-rot, simplifier, intent-check]
    trigger_rule: all_done
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the synthesize node of /pr-review for slug "$bootstrap.output.slug".
      SESSION = <artifacts_dir>/<slug>/pr-review/  (artifacts_dir=$bootstrap.output.artifacts_dir).

      1. Read every file in SESSION/findings/*.json that exists (a skipped aspect wrote none).
      2. Merge all `findings`, DEDUPE overlaps (same file + near-identical title across aspects → keep the
         highest-confidence one, note the other aspects). Ensure each finding has its stable `hash`.
      3. Bucket by severity (critical / important / minor). Collect `positives` across aspects.
      4. Collect the intent-check `ac_verdicts` and any contradictions.
      5. Assemble the body SECTIONS (no iteration header / delta yet — reconcile adds those):
           - `> ⚠ Intent sources disagree: …` callout (only if contradictions)
           - `### Intent Check` with `- AC-N: <verdict>` lines (omit only if intent unavailable)
           - `### 🔴 Critical (N)` / `### 🟠 Important (N)` / `### 🟡 Minor / Suggestions` — each finding a
             bold `` `file:line` `` + title, body beneath; omit an empty severity section.
           - `### ✅ What's good` — always present, from `positives`.
      Write the deduped this-run set to SESSION/findings.json (each finding incl. its hash) and the body
      sections to SESSION/summary-sections.md. Emit the counts.
    output_format:
      type: object
      properties:
        critical: { type: number }
        important: { type: number }
        minor: { type: number }
        contradictions: { type: array, items: { type: string } }
      required: [critical, important, minor]

  # ---------------------------------------------------------------------------------------------
  # reconcile — THE RE-REVIEW COORDINATOR. Classifies this run's findings against the prior iteration and
  # finalises the comment + inline plan. Keyed on the finding hash (marker), tolerating small line drift.
  # ---------------------------------------------------------------------------------------------
  - id: reconcile
    depends_on: [synthesize]
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the reconcile node of /pr-review for slug "$bootstrap.output.slug" — the re-review
      coordinator. SESSION = <artifacts_dir>/<slug>/pr-review/. ITERATION = $prep.output.iteration.

      1. Read SESSION/findings.json (this run) and SESSION/prep.json → `prior_findings` (prior iteration).
      2. Classify each finding by matching its `hash` against prior_findings (tolerate small line drift —
         match on aspect + file + semantic title, NOT the exact line number):
           - new           — no prior match
           - still-present — matched a prior finding still valid this run
           - fixed         — a prior finding with NO match this run (it no longer reproduces)
           - regressed     — a prior finding that was reported fixed, reappearing this run
      3. Compute the "since iteration N−1" delta: X fixed · Y still present · Z regressed · W new
         (skip the delta line entirely when ITERATION == 1).
      4. FINALISE the summary body → SESSION/comment.md, in this exact frame:

           <!-- unic-dlc-pr-review:iteration=<ITERATION> -->
           ## unic-dlc /pr-review — $prep.output.pr_title · Iteration <ITERATION>

           <contradictions callout, if any>
           ### Since iteration <ITERATION-1>        (only when ITERATION > 1)
           <delta line>
           <the ### Intent Check / severity / What's good sections from SESSION/summary-sections.md>
           ---
           🤖 Generated by unic-archon-dlc · Iteration <ITERATION> · re-run `/unic-dlc-pr-review $bootstrap.output.slug` to update.

         Tag each still-present / regressed finding inline in its section (e.g. "(still present since
         iteration N−1)" / "(⚠ regressed)").
      5. Build the inline-comment plan → SESSION/inline.json: an array of
         { file, line, severity, hash, classification, body } — one per finding. `body` starts with the
         hidden marker `<!-- unic-dlc-pr-review:finding=<hash> -->` then the rendered finding. Include a
         `fixed` entry for each prior finding now fixed (classification "fixed", body = a
         "✅ resolved in iteration <ITERATION>" reply) so `post` can reconcile the prior thread.
      Emit iteration + delta counts.
    output_format:
      type: object
      properties:
        iteration: { type: number }
        fixed: { type: number }
        still_present: { type: number }
        regressed: { type: number }
        new: { type: number }
      required: [iteration, fixed, still_present, regressed, new]

  # ---------------------------------------------------------------------------------------------
  # review-gate — HITL by default; skipped when gates.pr-review == afk. Shows the finalised summary +
  # delta + any contradiction warnings before anything is written. Posting is advisory/non-blocking.
  # ---------------------------------------------------------------------------------------------
  - id: review-gate
    depends_on: [reconcile]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        /pr-review for "$bootstrap.output.slug" — iteration $reconcile.output.iteration. Findings:
        $synthesize.output.critical critical · $synthesize.output.important important ·
        $synthesize.output.minor minor. Since last: $reconcile.output.fixed fixed ·
        $reconcile.output.still_present still present · $reconcile.output.regressed regressed ·
        $reconcile.output.new new. Review SESSION/comment.md (the composed summary) and SESSION/inline.json
        (the inline plan). APPROVE to post/update the summary + inline comments on the PR. REJECT to halt
        without posting.

  # ---------------------------------------------------------------------------------------------
  # post — write the review to the PR. trigger_rule: all_done so it runs when review-gate is SKIPPED in
  # AFK (skipped counts as terminal); a rejected gate cancels the run before this node. Composes the
  # configured tracker; matches by hidden marker so a re-run UPDATES in place rather than duplicating.
  # ---------------------------------------------------------------------------------------------
  - id: post
    depends_on: [review-gate]
    trigger_rule: all_done
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the post node of /pr-review for slug "$bootstrap.output.slug".
      SESSION = <artifacts_dir>/<slug>/pr-review/. ITERATION = $reconcile.output.iteration.
      PR_ID = $prep.output.pr_id. inline_comments = $bootstrap.output.inline_comments.

      Compose the configured tracker from `.archon/unic-dlc.config.yaml` (`tracker.type`; MCP-first,
      CLI-fallback — never hardcode a host, ADR-0016).

      ## Summary comment (always)
      Read SESSION/comment.md. Search the PR's comments for the FIRST comment containing the marker
      `<!-- unic-dlc-pr-review:iteration=` (match the marker, NEVER the author).
        - github → find via `gh pr view "$PR_ID" --json comments`; PATCH the matched comment with
          `gh api ... -X PATCH -f body=@SESSION/comment.md`, else `gh pr comment "$PR_ID" --body-file`.
        - ado    → `az repos pr thread list`; update the matched general-comment thread's first comment,
          else create a new general-comment thread.
        - jira / local-markdown → update the marked comment / overwrite SESSION/comment.md as the record.
      The comment.md already carries the bumped `iteration=<ITERATION>` marker + footer.

      ## Inline comments (when inline_comments == "true" AND the tracker supports inline threads)
      Read SESSION/inline.json. github + ado support inline threads; jira / local-markdown DO NOT →
      print "inline: tracker <type> has no inline threads — summary only" and skip. For each entry, match
      an existing inline thread by its `<!-- unic-dlc-pr-review:finding=<hash> -->` marker and reconcile
      by `classification`:
        - still-present → update the existing thread comment in place.
        - fixed         → reply "✅ resolved in iteration <ITERATION>" and resolve the thread where the
                          tracker supports a resolved status (best-effort; otherwise just reply).
        - regressed     → reopen the thread (or open a new one) noting the regression.
        - new           → create a new inline thread at file:line.
      (github: `gh api` review comments; ado: `az repos pr thread create/update` with threadContext.)

      Finally print: "pr-review: iteration <ITERATION> posted for \"$bootstrap.output.slug\" —
      <summary action>, <n> inline (<new> new · <upd> updated · <fixed> resolved). ✓"
