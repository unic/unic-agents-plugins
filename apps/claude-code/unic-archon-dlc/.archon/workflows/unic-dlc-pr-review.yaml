name: unic-dlc-pr-review
description: >
  Generic, self-contained PR review. One `review` node reads the `code-review` Method by path and runs
  its own two-axis fan-out — Standards (repo standards plus the twelve-item Fowler smell baseline, which
  is where refactoring lives now that /build's loop has no REFACTOR phase) and Spec (does the diff match
  what was asked for) — as parallel sub-agents, grounded in the Intent Brief composed once in prep from
  the linked work items, the referenced docs pages, the PR description, and PRD.md. Synthesises this run's
  findings, reconciles them against the prior iteration (new / still-present / fixed / regressed), then —
  after a config-gated human confirm — posts/updates one structured summary discussion plus per-line
  discussions on the current PR, through the tracker its contract at `docs/agents/issue-tracker.md`
  names. Harvests unic-pr-review's review
  learnings without its host-specific code or any dependency (ADR-0016/0017). Ported to the key-discriminated node
  schema (ADR-0011); inherits /build's self-contained-node conventions (ADR-0023 §5). This Box holds the
  only posting authority in the lifecycle. See ADR-0026, ADR-0030, ADR-0031.

# Required at the workflow level so the review-gate approval message reaches the user (ADR-0011).
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config. A prompt node (NOT a script) so it needs
  # no plugin-lib import and no $CLAUDE_PLUGIN_ROOT (ADR-0023 §5): it reads .archon/unic-dlc.config.yaml
  # with its own tools. Posting is AFK-safe; the human checkpoint here is the review-gate, and the real
  # merge gate lives in /qa.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /pr-review workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug (kebab-case).
         If $ARGUMENTS is empty → status "no-slug".
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`                  (default "workflows")
             `gates.pr-review`                (default "hitl")
             `pr-review.confidence_threshold` (default 60)
             `pr-review.inline_comments`      (default true)
             `docs.type` / `docs.access`      (for intent composition from docs)
             `project.branching`              (default "gitflow")
      3. If slug and config are both present → status "ready".
         (There is no PRD precondition: intent is composed from whatever sources resolve — see prep.)

      Compute `expected_base` from branching: "develop" when branching == "gitflow", else "main".
      ALWAYS emit EVERY required field, including in the no-slug and no-config branches, so the object
      validates before a guard can cancel. When a value cannot be read, fall back to: slug "" (if
      no-slug), artifacts_dir "workflows", gate "hitl", confidence_threshold 60, inline_comments
      "true", branching "gitflow", expected_base "develop". `inline_comments` is emitted as the STRING
      "true"/"false" (enum) so downstream `when` comparisons are reliable. Set `message` to a
      human-readable reason for any non-ready status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        confidence_threshold: { type: number }
        inline_comments:
          type: string
          enum: ['true', 'false']
        branching: { type: string }
        expected_base: { type: string }
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, confidence_threshold, inline_comments, branching, expected_base, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly (ADR-0011: cancel vs fail). One guard,
  # because there is no repository to resolve: `docs/agents/issue-tracker.md` names it.
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /pr-review preconditions not met — see the bootstrap output for whether the slug or
      .archon/unic-dlc.config.yaml is missing. Pass a slug (`/unic-dlc-pr-review <slug>`) and run
      /unic-archon-dlc:setup first if there is no config.

  # ---------------------------------------------------------------------------------------------
  # prep — the shared context builder. Identifies the open PR, computes the diff, categorises the
  # changed files, composes ONE Intent Brief from every available source, detects the prior review
  # iteration, and writes everything to <artifacts_dir>/<slug>/pr-review/ so the review node reads it
  # off disk (fresh nodes share no memory — ADR-0012/0015). Composing intent once and injecting it into
  # both review axes is the primary quality lever (ADR-0026): each axis judges the diff against what the
  # PR is SUPPOSED to do.
  #
  # The five changed-file category booleans no longer gate node spawning — the seven conditionally
  # spawned aspect nodes collapsed into one always-running `review` node (#281). They stay because they
  # are durable diff metadata in prep.json that a reader (and a future spawn decision) can use; nothing
  # reads them today. Retire them or find them a consumer in a follow-up, not in a rewiring slice.
  # ---------------------------------------------------------------------------------------------
  - id: prep
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the prep node of /pr-review for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        SESSION       = <ARTIFACTS_DIR>/<SLUG>/pr-review/
      Create SESSION if it does not exist.

      ## The tracker contract
      `docs/agents/issue-tracker.md` and `docs/agents/triage-labels.md` in this repository are the
      tracker contract. This node needs the first. Read it before the first tracker call.
      - **Access** — its § Access names the MCP server or skill that serves this tracker. Read that
        server's own current tool list and build every call from it. Write no command, subcommand or
        flag here and name no provider: the DLC owns the what and none of the how (ADR-0016), and a
        flag table frozen in this file is stale the moment the tool changes.
      - **Addressing** — its § Addressing names the repository this run acts on. Name that repository
        explicitly in every call, and derive nothing from a remote URL.
      - **Work-item scope** — its § Work-item scope names the one filter every search applies.
      If the file is absent, STOP and print "BLOCKED: this repository has no tracker contract at
      docs/agents/issue-tracker.md", and read nothing from the tracker.

      ## 1. Identify the open PR + read its description
      Ask the tracker for the open PR whose source branch is the current branch on that repository, and
      read its number, title, description body, source branch and target branch. If the tracker has no
      queryable PR at all, note that and continue — the review still runs off the diff.
      Store PR_ID, PR_TITLE, and the PR DESCRIPTION BODY (an intent source).

      ## 2. Compute the diff + categorise changed files
      BASE_REF = the upstream base (merge-base of the PR base branch and HEAD). Try
      `git merge-base origin/$bootstrap.output.expected_base HEAD`; fall back to `HEAD~1`.
      Write the unified diff to `SESSION/diff.patch` (`git diff <BASE_REF>...HEAD`) and the changed-file
      list to `SESSION/changed-files.txt` (`git diff --name-only <BASE_REF>...HEAD`).
      Categorise the changed files into these STRING booleans ("true"/"false"):
        has_source              — any non-test source file (.mjs/.js/.ts/.py/… excluding tests/docs)
        has_tests               — any test file (*.test.*, *.spec.*, test/, tests/, __tests__/)
        has_types               — any type/JSDoc-type change (.ts/.d.ts, or added `@param`/`@returns`/`@type`)
        has_docs                — any .md/.mdx/doc file OR added/removed comment lines
        touches_error_handling  — the diff adds/changes try/catch, `.catch(`, `??`/`||` fallbacks, or early returns on error

      ## 3. Compose ONE Intent Brief (injected into both review axes)
      Gather intent from EVERY source that resolves — none is individually required:
        a. Linked work items — the tracker items this PR links to, read through its links collection
           first and from the PR body or branch name only when that collection is empty.
        b. Docs pages — pages referenced in the work item or PR body, or discoverable via the
           configured docs system-skill (`docs.type`/`docs.access`).
        c. The PR description body (from step 1).
        d. `<ARTIFACTS_DIR>/<SLUG>/PRD.md` if it exists (what /specs wrote).
      Write `SESSION/intent-brief.md`: a short narrative of the intended behaviour + a numbered
      Acceptance Criteria list (AC-1, AC-2, …) distilled across the sources.
      Set `intent_available` = "true" only if at least one source resolved; else "false" (and write a
      one-line brief saying no intent sources were found).
      **Contradictions:** when sources disagree (e.g. the work item says one thing, the PR body another),
      record each as a short string in `contradictions` AND note it at the top of intent-brief.md. Do not
      silently pick a winner.

      ## 4. Detect the prior review iteration
      Scan the PR's existing comments/threads for the hidden marker `<!-- unic-dlc-pr-review:iteration=N -->`
      (match on the MARKER, never on comment author). Take the HIGHEST N found. Set `iteration` = N+1
      (or 1 if none). Parse the prior findings from the prior summary + inline markers
      (`<!-- unic-dlc-pr-review:finding=<hash> -->`) into `prior_findings` (each: hash, aspect, file,
      title, anchored, prior_verdict) so reconcile can classify against them. EVERY prior finding
      carries that marker: an anchored discussion carries it, and the prior summary carries one beside
      each finding it renders. Set `anchored` to "true" when you found the hash on a discussion
      anchored to a file and a line, and "false" when you found it only in the summary body — reconcile needs to know which
      prior findings own a live thread. Set `prior_verdict` to "fixed" when you found the marker in
      the summary's fixed list, and "open" otherwise: without it a finding the prior iteration RESOLVED
      reads exactly like one it reported, so it would be re-reported as fixed on every later iteration
      and `regressed` could never fire. Read `file` from the locator the summary renders, and
      **a locator that is one of the three literal scope tokens — `pull request`, `work item`,
      `repository` — is a scope, not a path: record the token verbatim in `file`.** A host may nest a
      reply under its parent rather than listing every comment flat, so walk each thread's replies too.
      If the tracker exposes no discussion at all, set iteration 1 and prior_findings [].
      Write `SESSION/prep.json` mirroring the emitted object for durability.

      ALWAYS emit EVERY required field so the object validates (downstream nodes and `prep.json` assume
      they exist). When no PR is queryable, use `pr_id` "" and `pr_title` "". `contradictions` and
      `prior_findings` are ALWAYS arrays — `[]` when there is nothing to report. Emit the structured object.
    output_format:
      type: object
      properties:
        pr_id: { type: string }
        pr_title: { type: string }
        base_ref: { type: string }
        has_source: { type: string, enum: ['true', 'false'] }
        has_tests: { type: string, enum: ['true', 'false'] }
        has_types: { type: string, enum: ['true', 'false'] }
        has_docs: { type: string, enum: ['true', 'false'] }
        touches_error_handling: { type: string, enum: ['true', 'false'] }
        intent_available: { type: string, enum: ['true', 'false'] }
        contradictions: { type: array, items: { type: string } }
        iteration: { type: number }
        prior_findings:
          type: array
          items:
            type: object
            properties:
              hash: { type: string }
              aspect: { type: string }
              file: { type: string }
              title: { type: string }
              anchored: { type: string, enum: ['true', 'false'] }
              prior_verdict: { type: string, enum: ['open', 'fixed'] }
            required: [hash, aspect, file, title, anchored, prior_verdict]
      required: [pr_id, pr_title, base_ref, has_source, has_tests, has_types, has_docs, touches_error_handling, intent_available, contradictions, iteration, prior_findings]

  # =============================================================================================
  # review — ONE node hosting the `code-review` Method's OWN two-axis fan-out (Standards · Spec).
  #
  # This replaced seven hand-written aspect nodes (code-quality, tests, silent-failure, type-design,
  # comment-rot, simplifier, intent-check) whose prompts restated ground `code-review` already covers
  # and upstream now maintains. The Method implements its own parallelism — its step 4 spawns two
  # sub-agents — so the Harness delegating to it is the whole point: nothing about running two
  # sub-agents needs the Harness, and re-implementing step 4 as two Archon nodes is the exact defect
  # ADR-0030's structural bar forbids. The Harness keeps what no Method supplies: the Intent Brief,
  # the finding contract below, hash-keyed re-review, the config gate and the two posting surfaces
  # (#281, amending ADR-0026).
  #
  # The finding contract lives in the node's own prompt below, under "## The finding contract". A YAML
  # comment is not part of a prompt, so a rule stated only here is invisible at run time. Every rule
  # this Box must honour is written in the prompt that honours it, for that reason.
  # =============================================================================================

  - id: review
    depends_on: [prep]
    context: fresh
    allowed_tools: [Read, Write, Bash, Glob, Grep, Agent]
    prompt: |
      You are the review node of /pr-review for slug "$bootstrap.output.slug".
      SESSION = <artifacts_dir>/<slug>/pr-review/ (artifacts_dir=$bootstrap.output.artifacts_dir).
      threshold = $bootstrap.output.confidence_threshold.

      Read `.archon/methods/code-review/SKILL.md` in full, by that literal repo-relative path. That is the
      one path a Method lives at: an Archon node cannot import anything from the Plugin (ADR-0023 §5),
      and the config and `.local` override tiers are retired (ADR-0031, amended). If the file is missing that
      is FATAL for this node: print "code-review Method not found at
      .archon/methods/code-review/SKILL.md — run /unic-archon-dlc:setup" and stop. Do not review from
      memory of what the Method says.

      Follow its Process steps 1–5. It asks a live human for two inputs; there is no human in this node,
      so both are supplied here and you must NOT ask:

      - **Step 1, the fixed point:** `$prep.output.base_ref` — prep already computed it as the
        merge-base of the PR base branch and HEAD. Confirm it resolves and the diff is non-empty before
        spawning anything, as the Method requires. prep also wrote the diff to SESSION/diff.patch and
        the changed-file list to SESSION/changed-files.txt; use them rather than recomputing.
      - **Step 2, the spec source:** `SESSION/intent-brief.md` — prep already distilled it from the
        linked work items, the referenced docs, the PR description and PRD.md, with a numbered
        Acceptance Criteria list. Never ask where the spec is. If
        `$prep.output.intent_available == "false"` the brief says so explicitly: then, per the Method,
        skip the Spec sub-agent and record "no spec available".
      - **The "/setup-matt-pocock-skills if `docs/agents/issue-tracker.md` is missing" fallback never
        applies.** `/unic-archon-dlc:setup` owns that file and `docs/agents/triage-labels.md`, and
        `setup-matt-pocock-skills` is not a Plugin dependency — a run writes another host's template over
        the first and reverts the second to a five-role vocabulary (ADR-0024). Never run it.

      Then steps 3–5 verbatim:
      - Step 3: gather this repo's standards sources (CLAUDE.md / AGENTS.md / CONTRIBUTING.md /
        CODING_STANDARDS.md — whatever exists) and take the Method's twelve-item Fowler smell baseline
        as written. This baseline is where refactoring now lives: /build's loop has no REFACTOR phase,
        because `tdd` puts refactoring in the review stage (#281).
      - Step 4: send ONE message with two `Agent` tool calls, `general-purpose` subagent for both.
        **Paste the twelve-item smell baseline IN FULL into the Standards sub-agent's prompt** — step 4
        is explicit that the sub-agent has no other access to it, and an abridged paste silently
        narrows the review. Add SESSION/intent-brief.md to BOTH sub-agent prompts: intent-grounding is
        this Box's quality lever, so neither axis judges the diff without knowing what it was for.
      - Step 5: aggregate under `## Standards` and `## Spec`. Never merge or rerank the two axes.

      ## The finding contract
      Convert every finding from either axis into this shape. Echo any
      `$prep.output.contradictions` as findings too, so they reach the summary.

      - Confidence 0–100 → severity: 90–100 critical, 80–89 important, 60–79 minor,
        below `threshold` → DROP before writing.
      - Finding shape: { aspect, severity, confidence, file, line, title (≤80 chars, no trailing
        period), body (1–4 sentences), suggestion? (only when a mechanical drop-in fix exists), hash }
      - `aspect` is "standards" or "spec" — reconcile matches on the hash, so the aspect must be stable
        across iterations or every finding reads as new.
      - **Anchorable or scoped — decide this for every finding.**
        A finding is **anchorable** when it names a file listed in SESSION/changed-files.txt and a line
        of that file's diff. Then `file` is that path and `line` is that number.
        Every other finding is **scoped**: it is about the pull request, a work item, or the repository
        as a whole, and no line of the diff owns it. A scoped finding takes `line: null` and `file`
        from this closed vocabulary of exactly three literal tokens, spelled as written here:
          - `pull request` — the description, the title, the branch, the commit set, the PR's own metadata
          - `work item`    — the linked tracker item, its acceptance criteria, or the link itself
          - `repository`   — a whole-repository observation the diff does not localise
        `file` holds a path only when the finding is genuinely about a line of that file's diff; a
        file that merely sits near the problem is the wrong answer.
        The token is what the summary displays in place of `file:line`, and it is what the hash uses,
        so a scoped finding hashes the same on every iteration.
      - `hash` — sha1-ish of aspect + file + normalised-title, NOT the line number, where `file` is the
        changed-file path for an anchorable finding and the literal token for a scoped one. Nothing
        that varies run to run enters the hash. What you compute here is a FIRST-APPEARANCE hash: the
        moment reconcile matches this finding to a thread an earlier iteration opened, that thread's
        marker becomes its identity and your value is replaced.
      - Calibrate against the Intent Brief: do NOT flag a spec-mandated choice as a defect; DO flag a
        documented requirement the diff misses.
      - Also collect `positives` (things done well) across both axes, for the "What's good" section.

      Write SESSION/findings/review.json as:
        {"findings": [...], "positives": [...],
         "standards_report": "<the ## Standards text>", "spec_report": "<the ## Spec text>"}
      Keep `standards_report` and `spec_report` as the Method's own prose — synthesize renders
      `spec_report` as the Intent Check section, which is how AC-coverage survives the collapse of the
      old intent-check node.

      If the `Agent` tool is unavailable in this node and you cannot spawn the two sub-agents, do NOT
      silently restructure the review into something else (not one axis, not seven aspects): print
      "REVIEW BLOCKED: Agent tool unavailable in an Archon prompt node — code-review step 4 cannot run
      as written", write SESSION/findings/review.json with that sentence as `standards_report` and
      empty arrays, and stop. That is a real finding about the container, not a detail to route around.

  # ---------------------------------------------------------------------------------------------
  # synthesize — THIS RUN ONLY. Reads the review node's single SESSION/findings/review.json, dedupes
  # overlaps across the two axes, buckets by severity, assigns each finding its stable hash marker, and
  # assembles the severity-grouped body sections + the Intent Check section + the contradictions callout.
  # No prior-iteration awareness here — that is reconcile's job. `trigger_rule: all_done` is gone with
  # the seven skippable aspect siblings: `review` always runs, so a plain dependency is honest.
  # ---------------------------------------------------------------------------------------------
  - id: synthesize
    depends_on: [review]
    context: fresh
    allowed_tools: [Read, Write, Bash, Glob]
    prompt: |
      You are the synthesize node of /pr-review for slug "$bootstrap.output.slug".
      SESSION = <artifacts_dir>/<slug>/pr-review/  (artifacts_dir=$bootstrap.output.artifacts_dir).

      1. Read SESSION/findings/review.json — the review node's Standards + Spec output.
      2. Merge its `findings`, DEDUPE overlaps (same file + near-identical title across the two axes →
         keep the highest-confidence one, note the other axis). Ensure each finding has its stable
         `hash`. Do NOT rerank one axis against the other; deduping identical findings is not reranking.
         Scoped findings share one of only three `file` values, so their titles carry the whole
         distinction: give any two scoped findings that normalise to the same title one sharper title
         each, or they collide on one hash and the second one disappears.
      3. Bucket by severity (critical / important / minor). Collect `positives`.
      4. Collect any contradictions from `$prep.output.contradictions`.
      5. Assemble the body SECTIONS (no iteration header / delta yet — reconcile adds those):
           - `> ⚠ Intent sources disagree: …` callout (only if contradictions)
           - `### Intent Check` — render the review node's `spec_report` verbatim. The Spec axis IS the
             AC-coverage judgement (requirements missing or partial, scope creep, requirements that look
             implemented but wrong), so it replaces the old per-AC verdict list. Omit the section only
             when `$prep.output.intent_available == "false"`.
           - `### 🔴 Critical (N)` / `### 🟠 Important (N)` / `### 🟡 Minor / Suggestions` — each finding a
             bold locator + title, body beneath; omit an empty severity section. An anchorable finding's
             locator is `` `file:line` ``. A scoped finding's locator is its literal token —
             `` `pull request` ``, `` `work item` `` or `` `repository` `` — alone, with no line and no
             file path beside it. The token is the same string that entered the hash, so the summary
             reads the same on every iteration.
             **Open every finding's block with its hidden marker,
             `<!-- unic-dlc-pr-review:finding=<hash> -->`, on its own line before the locator.** The
             summary is the only surface a scoped finding ever reaches, so this marker is how the next
             iteration reads its hash back; a finding rendered without one is invisible to the run
             after this and starts again as new. Markdown hides the comment from the reader.
           - `### ✅ What's good` — always present, from `positives`.
      Write the deduped this-run set to SESSION/findings.json (each finding incl. its hash) and the body
      sections to SESSION/summary-sections.md. Emit the counts.
    output_format:
      type: object
      properties:
        critical: { type: number }
        important: { type: number }
        minor: { type: number }
        contradictions: { type: array, items: { type: string } }
      required: [critical, important, minor]

  # ---------------------------------------------------------------------------------------------
  # reconcile — THE RE-REVIEW COORDINATOR. Classifies this run's findings against the prior iteration and
  # finalises the comment + inline plan. Keyed on the finding hash (marker), tolerating small line drift.
  # ---------------------------------------------------------------------------------------------
  - id: reconcile
    depends_on: [synthesize]
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the reconcile node of /pr-review for slug "$bootstrap.output.slug" — the re-review
      coordinator. SESSION = <artifacts_dir>/<slug>/pr-review/. ITERATION = $prep.output.iteration.

      1. Read SESSION/findings.json (this run) and SESSION/prep.json → `prior_findings` (prior iteration).
      2. Classify each finding against prior_findings. Match on the `hash` first. Where no hash
         matches, match on **aspect + semantic title + `file`**, with one exception that is the whole
         point of this step: **`file` differing between a path and a scope token is not a mismatch.**
         A finding anchorable in one iteration and scoped in the next carries two different `file`
         values by design, so compare the two only when both are paths. Two findings that share a
         title in two different files stay distinct. The line number is never part of the match —
         small line drift is expected.
         Because a path-versus-token difference is not a mismatch, one scoped finding can match two
         prior findings that share a title in different files. Step 3 needs each prior hash used once,
         so break the tie in this order and record which prior you picked: the closest semantic title,
         then the one whose `anchored` is "true", then the lexically smallest hash. A prior finding you
         did not pick stays unmatched, and step 3 rules it `fixed`.
         Two one-off notes cover the prior iterations already live on real pull requests:
           - A prior iteration posted before #281 carries the retired seven aspect names (code-quality,
             tests, silent-failure, type-design, comment-rot, simplifier, intent-check) where this run
             carries "standards" / "spec". Match those on semantic title alone, ignoring the aspect, so
             the first re-review after the rewiring does not report every finding as new.
           - A prior iteration posted by a Box older than the anchorable/scoped rule gave a scoped
             finding an invented `file` — a path that merely sat near the problem. Its prior `file` is
             a path and this run's is `pull request`, `work item` or `repository`, so they differ by
             design. Match those on
             aspect + semantic title alone. Reading the differing `file` as "no match" reports a live
             finding as `fixed` and replies "✅ resolved" to it, which is the defect this whole step
             exists to prevent.
         Classifications:
           - new           — no prior match
           - still-present — matched a prior finding still valid this run
           - fixed         — a prior finding whose `prior_verdict` is "open" with NO match this run
           - regressed     — a prior finding whose `prior_verdict` is "fixed" and which matches a
                             finding this run: the previous iteration resolved it and it is back
           - retired       — a prior finding whose `prior_verdict` is "fixed" and which STILL has no
                             match. It was reported fixed and stayed fixed, so it leaves the ledger:
                             step 5 does not re-list it and it carries no marker forward. Without
                             this, an already-fixed finding is ruled `fixed` again every run, the
                             fixed list grows without bound, and the "since iteration N−1" delta
                             counts findings fixed several iterations ago as though they were fixed
                             this one. The ceiling: a retired finding that reappears two iterations
                             later reads as `new`, because nothing carries its hash any more. The
                             ledger has to end somewhere and this is where it ends.
         **The prior hash is the identity. Carry it forward.** The moment a finding matches a prior
         one, overwrite this run's hash with the prior finding's hash and use that hash everywhere
         downstream: in the summary, in the plan, in every count. Only a `new` finding keeps the hash
         this run computed. The marker `<!-- unic-dlc-pr-review:finding=<hash> -->` is what `post`
         matches on and what the next iteration reads back, so a matched finding given a fresh hash
         loses the thread and the history that go with it. A finding that was anchorable last iteration
         and is scoped this one is still-present, not new: the scope changed, the finding did not.
      3. **Emit a verdict for EVERY prior finding.** Walk `prior_findings` and confirm each hash appears
         exactly once in the classified set, as still-present, fixed, regressed or retired. A prior
         finding you cannot match to anything this run gets `fixed` or `retired` per its
         `prior_verdict` — say so explicitly rather than dropping it, because a dropped prior finding
         leaves its thread live with no reply and no resolution.
         Then state both numbers: the count of prior findings and the count of verdicts. They are
         equal. If they are not, you have dropped one — go back and classify it.
         **Because you loop until they match, that equality alone evidences nothing — so publish the
         two numbers that CAN come out wrong.**
         `unverified_fixed` is how many of your `fixed` verdicts rest on absence alone: the prior
         finding named a changed file and a line, and THIS run's diff does not touch that file at all.
         Nothing in the diff could have fixed it, so the match probably failed instead. Count a scoped
         prior here too — no diff localises a finding about the pull request or the repository, so a
         scoped `fixed` is never more than "it did not come up again". This is the match-health signal:
         it is not the same as `fixed`, because a `fixed` verdict on a finding whose file the diff DID
         change is evidence, and one on a file nothing touched is a guess.
         `unmatched_priors` is how many prior findings you could not account for at all, and it is the
         number that must be zero.
      4. Compute the "since iteration N−1" delta: X fixed · Y still present · Z regressed · W new
         (skip the delta line entirely when ITERATION == 1). `retired` findings are NOT in the delta:
         they were already reported fixed, so counting them again is what made the delta describe the
         whole history instead of this iteration.
      5. FINALISE the summary body → SESSION/comment.md, in this exact frame:

           <!-- unic-dlc-pr-review:iteration=<ITERATION> -->
           ## unic-dlc /pr-review — $prep.output.pr_title · Iteration <ITERATION>

           <contradictions callout, if any>
           ### Since iteration <ITERATION-1>        (only when ITERATION > 1)
           <delta line>
           <the ### Intent Check / severity / What's good sections from SESSION/summary-sections.md,
            with every marker rewritten — see below>
           ---
           🤖 Generated by unic-archon-dlc · Iteration <ITERATION> · re-run `/unic-dlc-pr-review $bootstrap.output.slug` to update.

         **Rewrite every `<!-- unic-dlc-pr-review:finding=<hash> -->` marker in those pasted sections
         to the hash step 2 settled on.** synthesize wrote them before any prior iteration was read, so
         each one still holds the hash this run computed; for a matched finding that is the hash step 2
         just replaced. Pasting the sections unchanged would publish the very hash the carry-forward
         exists to retire, and the next iteration would read it back and report the finding as new.
         Tag each still-present / regressed finding inline in its section (e.g. "(still present since
         iteration N−1)" / "(⚠ regressed)"). Under the delta line, name every `fixed` finding by title
         in one short list, **each entry preceded by its own
         `<!-- unic-dlc-pr-review:finding=<hash> -->` marker**: a fixed finding leaves no other trace in
         this iteration's sections, and a scoped one leaves no thread either, so this list is both the
         only place the reader sees it resolved and the only place the next iteration can read its hash
         back. A fixed finding whose marker you omit cannot return as `regressed` — it returns as new,
         which is the classification this whole node exists to keep stable.
      6. Build the thread plan → SESSION/threads.json: an array of
         { kind, file, line, severity, hash, classification, body }. Every entry's `body` starts with
         the hidden marker `<!-- unic-dlc-pr-review:finding=<hash> -->` and then the rendered finding.
         `kind` is "reply" or "anchor", and each kind has its own admission rule:
           - **reply** — one entry for EVERY prior finding whose `anchored` is "true", carrying its
             verdict as `classification` (still-present / fixed / regressed) and the hash its thread's
             marker already holds. `post` finds the thread by that marker alone, so a reply entry sets
             `file: null` and `line: null` — the thread already sits where it sits. A `fixed` entry's
             body is a "✅ resolved in iteration <ITERATION>" reply.
           - **anchor** — one entry for every finding this run that is anchorable AND owns no thread
             yet: classification `new`, or a match against a prior finding whose `anchored` is "false".
             It carries the real changed-file path in `file` and the real diff line in `line`.
             Check the path against SESSION/changed-files.txt before you write the entry. The tracker
             will not check it for you: on 2026-08-24 Azure DevOps accepted thread 65129 anchored to
             `.archon/unic-dlc.config.yaml` on !5787, a file neither revision touched. This admission
             rule is the only thing standing between a scoped finding and a thread on an unrelated
             file.
         A scoped finding never becomes an `anchor` entry, because it names no line to anchor to; when
         it owns no prior thread the summary carries it alone, tagged by step 5. A prior finding whose
         `anchored` is "false" is likewise carried by the summary: its verdict is the tag, and there is
         no thread to reply to.
      Emit iteration, the delta counts, and the two counts from step 3.
    output_format:
      type: object
      properties:
        iteration: { type: number }
        fixed: { type: number }
        still_present: { type: number }
        regressed: { type: number }
        new: { type: number }
        prior_count: { type: number }
        verdicts: { type: number }
        retired: { type: number }
        unverified_fixed: { type: number }
        unmatched_priors: { type: number }
      required:
        [iteration, fixed, still_present, regressed, new, retired, prior_count, verdicts, unverified_fixed, unmatched_priors]

  # ---------------------------------------------------------------------------------------------
  # review-gate — HITL by default; skipped when gates.pr-review == afk. Shows the finalised summary +
  # delta + any contradiction warnings before anything is written. Posting is advisory/non-blocking.
  # ---------------------------------------------------------------------------------------------
  - id: review-gate
    depends_on: [reconcile]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        /pr-review for "$bootstrap.output.slug" — iteration $reconcile.output.iteration. Findings:
        $synthesize.output.critical critical · $synthesize.output.important important ·
        $synthesize.output.minor minor. Since last: $reconcile.output.fixed fixed ·
        $reconcile.output.still_present still present · $reconcile.output.regressed regressed ·
        $reconcile.output.new new. Prior findings $reconcile.output.prior_count · verdicts
        $reconcile.output.verdicts, of which $reconcile.output.unverified_fixed were ruled fixed on
        absence alone — this run's diff touches nothing that could have fixed them — and
        $reconcile.output.unmatched_priors could not be accounted for at all. The last number should be
        zero; a high one before it means the match is failing rather than that the author fixed
        everything. Those two are what a broken match shows up in, not the equal pair.
        Review SESSION/comment.md (the composed summary) and SESSION/threads.json (the thread plan). APPROVE to post/update the summary
        discussion and the per-line ones on the PR. REJECT to halt
        without posting.

  # ---------------------------------------------------------------------------------------------
  # post — write the review to the PR. trigger_rule: all_done so it runs when review-gate is SKIPPED in
  # AFK (skipped counts as terminal); a rejected gate cancels the run before this node. Reads the
  # tracker contract; matches by hidden marker so a re-run UPDATES in place rather than duplicating.
  # ---------------------------------------------------------------------------------------------
  - id: post
    depends_on: [review-gate]
    trigger_rule: all_done
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the post node of /pr-review for slug "$bootstrap.output.slug".
      SESSION = <artifacts_dir>/<slug>/pr-review/. ITERATION = $reconcile.output.iteration.
      PR_ID = $prep.output.pr_id. inline_comments = $bootstrap.output.inline_comments.

      ## The tracker contract
      `docs/agents/issue-tracker.md` and `docs/agents/triage-labels.md` in this repository are the
      tracker contract. This node needs the first, and it is the only node in the lifecycle that
      writes a review — so read it before the first call.
      - **Access** — its § Access names the MCP server or skill that serves this tracker. Read that
        server's own current tool list and build every call from it. Write no command, subcommand or
        flag here and name no provider: the DLC owns the what and none of the how (ADR-0016), a flag
        table frozen in this file is stale the moment the tool changes, and inventing a subcommand is
        the one defect no test without a live tenant can catch. Ask what the tracker supports; do not
        assume.
      - **Addressing** — its § Addressing names the repository this run acts on. Name that repository
        explicitly in every call, and derive nothing from a remote URL.
      If the file is absent, STOP and print "BLOCKED: this repository has no tracker contract at
      docs/agents/issue-tracker.md", and post nothing.

      ## The summary discussion (always)
      Read SESSION/comment.md. **A discussion on the pull request itself** is what carries it — the
      review addresses the whole PR, not one line of it. Hosts carry that differently: one opens a
      discussion thread with no file anchored to it, another adds a comment to the pull request. Ask
      the tracker which it offers and use that; the two are the same act with two names.

      List the PR's existing discussions and take the FIRST entry containing the marker
      `<!-- unic-dlc-pr-review:iteration=` (match the marker, NEVER the author). A host may nest a
      reply under its parent, so walk each thread's replies as well as its first comment.
        - A match → update THAT entry's body in place with SESSION/comment.md, so a re-run never
          duplicates the summary.
        - No match → open a new one carrying SESSION/comment.md.
        - The tracker exposes no pull-request discussion at all → leave SESSION/comment.md as the
          record and say so.
      The comment.md already carries the bumped `iteration=<ITERATION>` marker + footer.

      ## Per-line discussions (when inline_comments == "true" and the tracker anchors one to a line)
      Read SESSION/threads.json — the thread plan. Ask the tracker whether it can anchor a discussion to
      a file and line of the PR. If it cannot, print "inline: this tracker anchors no discussion to a
      line — summary only" and skip this section.

      Each entry carries `kind`, and the two kinds are found differently:
        - **reply** — a thread that already exists. Find it by its
          `<!-- unic-dlc-pr-review:finding=<hash> -->` marker, **searching the PR's anchored discussions
          only**. The summary discussion carries the same marker for every finding it renders, so a
          search across all discussions returns two hits for one hash and the summary is the wrong one:
          it is rewritten whole from SESSION/comment.md by the section above, never replied to per
          finding. Within the anchored discussions the marker is the thread's identity and is the only
          key you need — the entry carries no file and no line on purpose, because the file the thread
          sits on is where an earlier iteration put it, not necessarily where the finding lives now.
          Then act on `classification`:
            - still-present → update that discussion's body in place.
            - fixed         → reply "✅ resolved in iteration <ITERATION>" and mark it resolved where the
                              tracker carries a resolved status (best-effort; otherwise just reply).
            - regressed     → reopen it noting the regression. Where the tracker offers no reopen,
                              reply on that same thread saying the finding is back. A reply entry
                              carries no file and no line, so it has nothing to anchor a new thread to.
          Answer every reply entry before you finish, and report a marker that matches no thread by its
          hash in your final line: a prior thread left with no reply and no resolution is the defect
          this plan exists to prevent.
        - **anchor** — a finding with no thread yet. Open a new discussion anchored at its
          `file`:`line`. Both are real: reconcile admits an anchor entry only for a finding that names
          a changed file and a diff line.

      ## The closing line (always, and outside the section above)
      Print this whether or not you skipped the per-line section and whether or not the gate ran. In
      AFK the gate is skipped, so this line is the only place the run states that every prior finding
      was answered:
      "pr-review: iteration <ITERATION> posted for \"$bootstrap.output.slug\" —
      <summary action>, <n> inline (<new> new · <upd> updated · <fixed> resolved) ·
      $reconcile.output.prior_count prior findings, $reconcile.output.verdicts verdicts,
      $reconcile.output.retired retired, $reconcile.output.unverified_fixed unverified-fixed,
      $reconcile.output.unmatched_priors unaccounted. ✓"
