name: unic-dlc-cleanup
description: >
  Post-merge cleanup: architecture review and ADR consolidation.
  Catches technical and intent drift and locks architectural decisions.

inputs:
  slug:
    description: Planning session identifier — matches the slug from the completed build cycle.
    required: true

nodes:
  - id: arch-review
    name: Architecture Review — Drift Detection
    type: prompt
    depends_on: []
    prompt: |
      You are running the unic-archon-dlc cleanup workflow — arch-review node.

      Goal: compare what was intended (PRD) against what was shipped (report + code) and
      surface any drift before the project moves on.

      ## Step 1 — Load context

      Read the following files in full:
        - docs/workflow/{{ inputs.slug }}/PRD.md         (intent)
        - docs/workflow/{{ inputs.slug }}/report.md      (technical outcome)
        - docs/workflow/{{ inputs.slug }}/issues.json    (issue breakdown)

      Also read the list of changed files from the build:
        Run: git diff --name-only HEAD~1 HEAD
        (or adapt the range if HEAD~1 is not the merge commit)

      For each changed source file, read its content.

      ## Step 2 — Detect technical drift

      Review the shipped code against architectural best practices:

        - **Too-shallow modules**: functions or classes that are mere pass-throughs with no
          real logic (a deep module hides complexity behind a small interface — the inverse is
          the anti-pattern here).
        - **Tight coupling**: direct imports of internal implementation details across module
          boundaries; callers that know about the internals of their dependencies.
        - **Leaky abstractions**: functions that expose internal data structures, require
          callers to know about implementation order, or have error modes that only make sense
          if you understand the internals.

      For each issue found, note: file path, line(s), problem description, suggested fix.

      ## Step 3 — Detect intent drift

      Compare the PRD's user stories and acceptance criteria against the implementation:

        - Delivered behaviour that diverges from what the PRD describes (not the same as tech
          debt — this is wrong behaviour, not merely imperfect code).
        - Acceptance criteria from the PRD that were silently dropped or narrowed during build.
        - Features added during build that were not in the PRD (scope creep).

      For each issue found, note: PRD section referenced, what was described vs what was
      delivered, recommended action (fix now / create follow-up issue / accept as ADR).

      ## Step 4 — Identify deepening opportunities

      List at least one module that could be deepened to hide more complexity behind its
      current interface — or explicitly state "No deepening opportunities identified."

      ## Step 5 — Write arch-review.md

      Write docs/workflow/{{ inputs.slug }}/arch-review.md with the following sections:

        ## Architecture Review — {{ inputs.slug }}

        ### Technical Drift
        <findings or "No technical drift detected.">

        ### Intent Drift
        <findings or "No intent drift detected.">

        ### Deepening Opportunities
        <at least one suggestion, or "None identified.">

        ### Summary
        CLEAN | ISSUES FOUND (with count)

      Print: "arch-review written to docs/workflow/{{ inputs.slug }}/arch-review.md"

  - id: adr-consolidation
    name: ADR Consolidation — Per-ADR Approval Gate
    type: interactive
    fresh_context: true
    depends_on: [arch-review]
    prompt: |
      You are running the unic-archon-dlc cleanup workflow — adr-consolidation node.

      Goal: review every architectural decision recorded during the build cycle and get
      explicit human approval before writing any ADR to docs/adr/.

      ## Step 1 — Collect ADR candidates

      Gather decisions from:
        1. `docs/workflow/{{ inputs.slug }}/report.md` — "Decisions Made" section
        2. `docs/workflow/{{ inputs.slug }}/arch-review.md` — any decisions surfaced during review
           (e.g. "accept as ADR" items from intent drift findings)
        3. Any inline ADR drafts written by the build workflow nodes

      For each candidate, present it in this format:

        ---
        ADR Candidate N of M
        Proposed file: docs/adr/NNNN-<slug>.md
        Status: [Proposed]
        Context: <one paragraph — what situation prompted this decision>
        Decision: <one sentence — what was decided>
        Consequences: <bullet list — trade-offs accepted>
        ---

        Accept (A) / Reject (R) / Edit (E)?

      ## Step 2 — Gate each ADR individually

      Wait for the user to respond with A, R, or E for each candidate:
        - **A (Accept)**: write the ADR to docs/adr/NNNN-<slug>.md using the next
          available NNNN (check existing files in docs/adr/).
          Print: "ADR written: docs/adr/NNNN-<slug>.md"
        - **R (Reject)**: skip this candidate.
          Print: "ADR skipped: <title>"
        - **E (Edit)**: show the ADR draft again and allow the user to revise the
          Context, Decision, or Consequences fields. Re-present for A/R after edits.

      ## Step 3 — Summary

      After all candidates are processed, print:

        adr-consolidation complete.
        Accepted: N | Rejected: M | Edited then accepted: K
        Files written: (list of docs/adr/NNNN-*.md paths, or "none")
