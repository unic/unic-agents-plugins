name: unic-dlc-build
description: >
  TDD build execution wrapper: slopcheck gate → generated per-slug build workflow.
  Each issue goes red (failing tests) before green (passing implementation).
  Independent issues run in parallel; chained issues run in dependency order.

inputs:
  slug:
    description: Planning session identifier — matches the slug used in /unic-dlc-plan.
    required: true

nodes:
  - id: slopcheck
    name: Slopcheck — Verify New Packages
    type: bash
    depends_on: []
    script: |
      #!/usr/bin/env node
      // @ts-check
      import { execFileSync } from 'node:child_process'
      import { existsSync, readFileSync } from 'node:fs'
      import { join } from 'node:path'
      import { classifyPackages, parseNewPackages } from './lib/slopcheck.mjs'

      const projectDir = process.cwd()
      const pkgPath = join(projectDir, 'package.json')

      if (!existsSync(pkgPath)) {
        console.log('slopcheck: no package.json found, skipping.')
        process.exit(0)
      }

      // Get the previous package.json from HEAD (if in a git repo)
      let prevDeps = {}
      try {
        const prev = execFileSync('git', ['show', 'HEAD:package.json'], { cwd: projectDir, encoding: 'utf8' })
        const parsed = JSON.parse(prev)
        prevDeps = { ...parsed.dependencies, ...parsed.devDependencies }
      } catch {
        // Not in a git repo or no HEAD — treat all current packages as new (strictest)
        console.log('slopcheck: cannot read HEAD:package.json, treating all packages as new.')
      }

      const current = JSON.parse(readFileSync(pkgPath, 'utf8'))
      const currentDeps = { ...current.dependencies, ...current.devDependencies }
      const newPkgs = parseNewPackages(prevDeps, currentDeps)

      if (newPkgs.length === 0) {
        console.log('slopcheck: no new packages detected. ✓')
        process.exit(0)
      }

      console.log(`slopcheck: found ${newPkgs.length} new package(s): ${newPkgs.join(', ')}`)

      // Determine registry check strategy
      let registryFn = null

      // Strategy 1: Python slopcheck tool
      try {
        execFileSync('slopcheck', ['--version'], { encoding: 'utf8' })
        registryFn = async (/** @type {string} */ name) => {
          try {
            execFileSync('slopcheck', ['check', name], { encoding: 'utf8' })
            return true
          } catch {
            return false
          }
        }
        console.log('slopcheck: using Python slopcheck tool.')
      } catch {
        // Python tool not on PATH, try npm registry HEAD check
        try {
          const { default: https } = await import('node:https')
          registryFn = (/** @type {string} */ name) =>
            new Promise((resolve) => {
              const encoded = encodeURIComponent(name).replace(/^%40/, '@')
              const req = https.request(
                { hostname: 'registry.npmjs.org', path: `/${encoded}`, method: 'HEAD' },
                (res) => resolve(res.statusCode === 200),
              )
              req.on('error', () => resolve(false))
              req.setTimeout(5000, () => {
                req.destroy()
                resolve(false)
              })
              req.end()
            })
          console.log('slopcheck: using npm registry HEAD check fallback.')
        } catch {
          console.log('slopcheck: no registry check available — all new packages treated as [ASSUMED].')
        }
      }

      const verdicts = await classifyPackages(newPkgs, registryFn)
      const assumed = verdicts.filter((v) => v.assumed)

      if (assumed.length === 0) {
        console.log('slopcheck: all new packages verified in registry. ✓')
        process.exit(0)
      }

      console.log('\nslopcheck: [ASSUMED] packages require human verification:')
      for (const pkg of assumed) {
        console.log(`  ⚠  ${pkg.name} — not found in registry or unverifiable`)
        console.log(`     checkpoint:human-verify — approve or reject this package before install continues`)
      }
      console.log(
        '\nslopcheck: halting build. Resolve the above packages (remove them, pin a real version,',
      )
      console.log('or run the build with SLOPCHECK_BYPASS=1 to accept assumed packages explicitly.')

      if (!process.env.SLOPCHECK_BYPASS) {
        process.exit(1)
      }

  - id: run-build
    name: Execute Generated Build Workflow
    type: prompt
    depends_on: [slopcheck]
    prompt: |
      You are running the unic-archon-dlc build workflow — run-build node.

      The slopcheck gate has passed. Now execute the generated build workflow for this slug.

      The generated workflow is at: .archon/workflows/build-{{ inputs.slug }}.yaml

      Actions:
      1. Verify that .archon/workflows/build-{{ inputs.slug }}.yaml exists.
         If it does not exist, print:
           "build-{{ inputs.slug }}.yaml not found. Run /unic-dlc-plan {{ inputs.slug }} first to generate it."
         and halt.

      2. Invoke the generated workflow via Archon:
         Run: archon run .archon/workflows/build-{{ inputs.slug }}.yaml --input slug={{ inputs.slug }}

         The generated workflow contains:
           - code-red-<id> nodes: write FAILING acceptance tests per issue
           - code-green-<id> nodes: write minimum implementation to pass those tests
           - Dependency edges enforce: red before green within each issue
           - Independent issues run code-red (and code-green) in parallel

      3. After the workflow completes, print:
         "build-{{ inputs.slug }} complete. All issues have been implemented following red→green discipline."

      TDD rules enforced by the generated DAG:
        - Never write implementation before writing failing tests.
        - code-green nodes write ONLY enough code to pass the current tests.
        - No speculative features, no extra abstractions.
        - If a code-green node fails (tests still failing after implementation), pause and
          ask the user whether to retry or flag the issue for human review.
