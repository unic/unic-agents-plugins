name: unic-dlc-qa
description: >
  QA box + issue-producing on-ramp. Runs after /build's PR is approved: pr-check → test → e2e →
  coverage-gate → UAT sign-off → verify-pr-base → merge, config-driven and generic. `test` is the floor
  the merge gate cannot advance without. Every path that does not merge on a result ends cancelled,
  never completed. A node that fails ends the run failed. Two human gates (UAT + merge)
  honour gates.qa — HITL by default, AFK opt-in. When UAT surfaces a defect, it is filed directly as
  an agent-ready tracker item, through the contract at `docs/agents/issue-tracker.md` and
  `docs/agents/triage-labels.md`, so the finding feeds /tickets rather than only
  halting. Ported to the key-discriminated node
  schema; inherits /build's self-contained-node conventions.

# Required at the workflow level so the UAT + merge approval messages reach the user.
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config, confirm the QA baton exists.
  # A prompt node (NOT a script) so it needs no plugin-lib import and no $CLAUDE_PLUGIN_ROOT.
  # The agent reads .archon/unic-dlc.config.yaml with its own tools. Every command
  # comes from the one `sdlc_needs` block; only the coverage threshold still falls back
  # qa.* → build.*, so a team can hold a heavier QA bar than the build's.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /qa workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug (kebab-case).
         If $ARGUMENTS is empty → status "no-slug".
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`          (default "workflows")
             `gates.qa`               (default "hitl")
             `qa.coverage_threshold`  (may be null) — else fall back to `build.coverage_threshold`
             `project.branching`      (default "gitflow"), which decides only whether `merge`
                                      deletes the merged `feature/*` branch
             the whole `sdlc_needs` block
      3. Confirm the QA baton exists: `<artifacts_dir>/<slug>/PRD.md`. This is what /specs wrote and
         /build implemented — the acceptance criteria the UAT checklist is derived from.
         - If it is absent → status "no-prd".
      4. If slug, config, and PRD.md are all present → status "ready".

      This run's base branch is `$BASE_BRANCH`. Archon resolves it before this node starts, from
      `--base`, then `worktree.baseBranch` in `.archon/config.yaml`, then the codebase default. It is
      the base the PR must target. Read no base branch from the config, and never derive one from
      `project.branching`.
      `coverage_threshold` is the resolved (qa.* ?? build.*) value — null when neither is set.

      ## The `sdlc_needs` block — a key names a need, never a tool
      Every key in it names a NEED of this project's development process. `test` names the need;
      whichever runner this project uses is the tool that serves it, and this Box names none. Pass the
      block downstream as ONE object carrying ALL NINE keys — `install`, `build`, `test`, `e2e`, `lint`,
      `format`, `typecheck`, `dev`, `coverage` — every time. Copy each value the config sets verbatim:
      rename nothing, rewrite nothing, infer nothing. Emit `null` for every key the config omits. A
      config may carry a partial block, or none at all, and both are normal — a tenant hand-edits this
      file, and a key added by a later release reaches them only at their next `reconfigure`. What is
      never allowed is emitting fewer than nine keys: this node's schema requires all of them, so a
      short object fails validation and aborts the run before a guard can cancel it cleanly. A key that
      arrives null stays null. What happens next depends on the node: one that wants that need reports
      an **unresolved** check, one that does not want it reports nothing at all, and neither fabricates
      a command — a guessed command reports a result that means nothing.
      There is no per-Box override any more: the retired `qa.e2e_command` / `build.e2e_command` pair is
      replaced by the single `sdlc_needs.e2e`, and a config still carrying those keys is ignored.

      ## Install once, and say what you did
      One Archon worktree serves this whole run and may or may not already carry this project's
      dependencies. So install here, once, and nowhere else. When status is "ready", run
      `sdlc_needs.install` from the repo root if it is declared, and set `install_report` to:
        - declared, exit 0     → "ran the declared install command: ok"
        - declared, non-zero   → "ran the declared install command: FAILED — <what it printed>"
        - not declared         → "sdlc_needs.install is not declared, so nothing was installed.
                                  Dependencies may still be present in this worktree by chance, and a
                                  later green check here is not proof of a deliberately built
                                  environment."
      A failed install does not fail this node — report it and carry on. On any status other than
      "ready", set `install_report` to "not attempted (<status>)".

      Emit ONLY the structured object.

      ALWAYS emit EVERY required field, including in the no-slug / no-config / no-prd branches, so the
      object validates before a guard can cancel. When a value cannot be read (e.g. config is
      missing), fall back to: slug "" (if no-slug), artifacts_dir "workflows", gate "hitl", branching
      "gitflow". In EVERY branch, start `message` with "Base branch: $BASE_BRANCH." and follow it with
      a human-readable reason for any non-ready status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config, no-prd]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        coverage_threshold: { type: [number, 'null'] }
        sdlc_needs:
          type: object
          properties:
            install: { type: [string, 'null'] }
            build: { type: [string, 'null'] }
            test: { type: [string, 'null'] }
            e2e: { type: [string, 'null'] }
            lint: { type: [string, 'null'] }
            format: { type: [string, 'null'] }
            typecheck: { type: [string, 'null'] }
            dev: { type: [string, 'null'] }
            coverage: { type: [string, 'null'] }
          required: [install, build, test, e2e, lint, format, typecheck, dev, coverage]
        install_report: { type: string }
        branching: { type: string }
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, sdlc_needs, install_report, branching, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly. One guard,
  # because there is no repository to resolve: `docs/agents/issue-tracker.md` names it, which matters
  # most here — this is the Box that MERGES.
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /qa preconditions not met — see the bootstrap output for which of slug, config, or
      <artifacts_dir>/<slug>/PRD.md is missing. Run /unic-archon-dlc:build <slug> first (which in turn
      needs /specs + /tickets), so the acceptance criteria the UAT checklist reads from exist.

  # ---------------------------------------------------------------------------------------------
  # pr-check — read the PR state before any test runs. A /qa on a branch with no open PR can
  # merge nothing, so it must not spend the test, e2e and coverage runs, and it must not end completed.
  # `test` runs only on `pr_state == 'open'`, and the cancel below ends the run on every other state.
  # verify-pr-base reads the state again, because a PR can be merged or closed during UAT.
  # ---------------------------------------------------------------------------------------------
  - id: pr-check
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    # always_run: true. The PR state is a fact about the remote, not about this node's exit code. A
    # resume must query it again.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the pr-check node of /qa for slug "$bootstrap.output.slug".

      ## The tracker contract
      `docs/agents/issue-tracker.md` in this repository is the tracker contract. Read it before the
      query. Its § Access names the MCP server or skill that serves this tracker. Read that server's own
      current tool list and build the call from it. Write no command, subcommand or flag here, and name
      no provider. Its § Addressing names the repository to query. Name that repository
      explicitly, and derive nothing from a remote URL.

      Query the PRs whose head is the current feature branch on that repository, in every state. Set
      `pr_state`:
        · a PR is open → "open"
        · no PR is open, and one is merged → "merged"
        · no PR is open or merged, and one is closed → "closed"
        · the query succeeds and finds no PR → "none"
        · the query fails, or the contract is missing or cannot target a repository explicitly →
          "unknown"
      Never guess a state. A query that did not answer is "unknown".

      Set `message` to the text for the state, word for word, with the placeholders filled:
        · open    → "The PR for this branch is open."
        · none    → "No PR was ever opened for this branch. Fix the build and re-run /build."
        · merged  → "The PR for this branch is already merged. Nothing to do."
        · closed  → "The PR for this branch was closed without merging. Reopen it, or abandon the work."
        · unknown, failed query → "The PR state could not be read: <the error as received>. Check
          access to the tracker and re-run /qa."
        · unknown, missing or unusable contract → "The PR state could not be read:
          docs/agents/issue-tracker.md <is missing | cannot target a repository explicitly>. Add it
          with /unic-archon-dlc:setup."
      Print `message` as one line.
    output_format:
      type: object
      properties:
        pr_state:
          type: string
          enum: [open, merged, closed, none, unknown]
        message: { type: string }
      required: [pr_state, message]

  # ---------------------------------------------------------------------------------------------
  # guard-no-open-pr — its `when` is the exact negation of the `when` on `test`. When pr-check
  # succeeds, one of the two always holds and the run never goes on with nothing to merge.
  # ---------------------------------------------------------------------------------------------
  - id: guard-no-open-pr
    depends_on: [pr-check]
    when: "$pr-check.output.pr_state != 'open'"
    cancel: >
      /qa did not run the checks, because the PR for this branch is not open or could not be read.
      PR state: "$pr-check.output.pr_state". $pr-check.output.message

  # ---------------------------------------------------------------------------------------------
  # test — the floor. An earlier version of this Box ran no test suite and merged on an e2e
  # result that was almost always a skip. It is a prompt node that reads the declared command from
  # bootstrap and runs it with its own tools. It REPORTS a verdict rather than hard-failing, and the
  # merge `when` below requires that verdict to be `pass` — the one clause there that is not `!= fail`.
  # ---------------------------------------------------------------------------------------------
  - id: test
    depends_on: [pr-check]
    when: "$pr-check.output.pr_state == 'open'"
    # always_run: true — the result is a fact about the CURRENT branch; a resume must re-run it
    # rather than replay a cached pass from before the code changed underneath it.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the test node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** `test` is the need; whichever runner this project uses is the tool that serves
      it. Run exactly the command the key holds, append no flag of your own, and fabricate nothing for
      a key that is null.

      Run the `test` key of `$bootstrap.output.sdlc_needs` from the repo root, capture pass/fail
      counts, and set `result`:
        · the key is null, or its command will not run → "unresolved"
        · exit 0 → "pass"
        · non-zero → "fail"; include the failing tests in `summary`
      This node exists to produce a test outcome, so it always WANTS one: a null key is "unresolved"
      and never a silent skip. That distinction is what the merge gate reads. A "pass" reporting ZERO
      tests goes in `summary` as **suspicious** rather than as a green result — that is the shape a
      command declared against the wrong target takes.
      Print a one-line verdict:  "test: PASSED ✓" / "test: FAILED ✗ — <detail>" /
      "test: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # e2e — the end-to-end suite. Reports a verdict rather than hard-failing; a real failure fail-closes
  # the merge below and reaches the human at UAT first.
  # ---------------------------------------------------------------------------------------------
  - id: e2e
    depends_on: [test]
    when: "$bootstrap.output.status == 'ready'"
    # always_run: true — the result is a fact about the CURRENT branch; a resume must re-run it
    # rather than replay a cached pass from before the code changed underneath it.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the e2e node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** Run exactly the command the key holds, append no flag of your own, and fabricate
      nothing for a key that is null.

      Run the `e2e` key of `$bootstrap.output.sdlc_needs` from the repo root and capture pass/fail
      counts, then set `result`:
        · the key is null, or its command will not run → "unresolved"
        · exit 0 → "pass"
        · non-zero → "fail"; include the failing tests in `summary`
      A "pass" reporting ZERO tests goes in `summary` as **suspicious** rather than as a green result —
      that is the shape a command declared against the wrong target takes.
      This node exists to run the end-to-end suite, so it always WANTS one: a null key is "unresolved",
      never a skip. Unresolved is non-blocking here — only the test floor holds the merge — but it is
      reported, because an absent result and a green result are not the same fact.
      Print a one-line verdict:  "e2e: PASSED ✓" / "e2e: FAILED ✗ — <detail>" /
      "e2e: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # coverage-gate — enforce the coverage threshold against a declared coverage command. It wants a
  # figure always, so a null on either is `unresolved`, never a skip. This enum has no `skip`.
  # Reports a verdict like e2e (fail-closes the merge `when`, never hard-fails the run).
  # ---------------------------------------------------------------------------------------------
  - id: coverage-gate
    depends_on: [e2e]
    # always_run: true — same reason as e2e: coverage is a fact about the CURRENT tree, not a
    # promise carried by exit code 0.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the coverage-gate node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** Run exactly the command the `coverage` key holds. Append no coverage flag of your
      own to `test` or to any other declared command — `coverage` is a need of its own precisely so
      that nobody has to guess how this project asks its runner for a figure.

      Two values decide this node: the `coverage` key of `$bootstrap.output.sdlc_needs`, which produces
      the figure, and `$bootstrap.output.coverage_threshold`, which the figure is compared against.
      Set `result`:
        · either value is null, or the command will not run, or the figure cannot be parsed →
          "unresolved"
        · figure ≥ threshold → result "pass"
        · figure < threshold, or the command exits non-zero → result "fail"
      A run reporting 0%, or no covered files at all, goes in `summary` as **suspicious** rather than as
      a figure — that is the shape a coverage command pointed at the wrong target takes.
      This node exists to gate on coverage, so it always WANTS a figure: a null key or a null threshold
      is "unresolved", never a skip. Unresolved is non-blocking here — only the test floor holds the
      merge — but it is reported, because a threshold nobody could measure against is not a pass.
      Print a one-line verdict:  "coverage-gate: PASSED (<n>%)" / "coverage-gate: FAILED (<n>% <
      <threshold>%)" / "coverage-gate: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # uat-prep — build the UAT checklist from the PRD's acceptance criteria + /build's report. Must be
  # a prompt node: approval nodes run no AI, so the checklist is computed here and printed, then the
  # uat-gate approval references it. Runs in both hitl and afk (a durable record either way).
  # ---------------------------------------------------------------------------------------------
  - id: uat-prep
    depends_on: [coverage-gate]
    context: fresh
    # Write is here for one reason: this node files the check block into the Session dir. /qa has no
    # report node, and its console output dies with the worktree, so a block that exists only in
    # scrollback satisfies nothing — this is the one surface in this Box a human reads afterwards.
    allowed_tools: [Read, Bash, Glob, Write]
    prompt: |
      You are the uat-prep node of /qa for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        Session dir   = <ARTIFACTS_DIR>/<SLUG>/

      1. Read `<ARTIFACTS_DIR>/<SLUG>/PRD.md`. Extract every acceptance criterion (from the User
         Stories' "Acceptance criteria:" bullets and any "## Acceptance Criteria" section). Number
         them AC-1, AC-2, …
      2. Read `<ARTIFACTS_DIR>/<SLUG>/report.md` if it exists — it holds /build's goals-check coverage
         matrix and test outcomes.
      3. WRITE `<ARTIFACTS_DIR>/<SLUG>/qa-checks.md`, then print the same content (the uat-gate
         approval message points the reviewer at it). Write it as well as print it: this Box has no
         report node, so anything only printed here dies with the worktree and reaches nobody who
         reviews this run later.

           === Checks That Could Not Run ===
           <one line per need whose result is "unresolved", naming the need — and, where
            $bootstrap.output.sdlc_needs has no command for it, saying that the config declares none,
            which is the common cause and the one you can see from here>
           <$bootstrap.output.install_report, verbatim>

           === UAT Checklist for <SLUG> ===
           AC-N: <criterion text>
             Evidence: <matching row from the coverage matrix, or "not recorded">
             [ ] Verified by human
           …
           test result:     <PASSED | FAILED | UNRESOLVED>   ($test.output.result)
           e2e result:      <PASSED | FAILED | UNRESOLVED>   ($e2e.output.result)
           coverage result: <PASSED | FAILED | UNRESOLVED>   ($coverage-gate.output.result)

         The first block comes first and stays even when nothing is unresolved — write "every declared
         check ran" then. A check nobody could run is the fact a reader skips past when it sits in a
         paragraph, which is why it is a block of its own and why it goes above the checklist.

      Emit the numbered criteria as structured output so the finding-capture step can reference them
      by number when a defect is rejected.
    output_format:
      type: object
      properties:
        criteria:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              evidence: { type: string }
            required: [id, text]
      required: [criteria]

  # ---------------------------------------------------------------------------------------------
  # uat-gate — HITL by default; skipped when gates.qa == afk. On REJECT, on_reject captures the
  # failing criteria as agent-ready tracker issues (finding-capture) BEFORE the run halts,
  # so the defect is durably tracked and feeds /tickets — not lost when the workflow cancels.
  # max_attempts: 1 → capture once, then a second reject cancels the run.
  #
  # The finding-capture brief shape below (what happened / what I expected / steps to reproduce /
  # blocked by / additional context) and the thin-issues heuristic above it were originally Matt
  # Pocock's `qa` Method. Upstream v1.1.0 moved `qa` to `skills/deprecated/` with no replacement, so
  # there is nothing left to resolve by name: the shape is inlined verbatim here and this Harness owns
  # it from now on. It is deliberately not a listed Method, because its upstream branch is gone.
  # ---------------------------------------------------------------------------------------------
  - id: uat-gate
    depends_on: [uat-prep]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        UAT for "$bootstrap.output.slug": review the UAT checklist in
        <artifacts_dir>/<slug>/qa-checks.md, which uat-prep wrote and also printed above, against the
        test, e2e and coverage-gate results. That file opens with the checks that could not run —
        read it before approving, because a need this project does not declare reports "unresolved"
        rather than failing, and the test result is the one the merge gate later refuses to advance
        without. APPROVE to proceed to PR-base verification and merge.
        REJECT with the failing item(s) (e.g. "AC-3: totals wrong for empty cart") — I will file each
        as an agent-ready issue on the tracker, then the gate re-pauses so you can REJECT again to halt.
      on_reject:
        prompt: |
          The reviewer rejected UAT for "$bootstrap.output.slug" with this feedback:
          $REJECTION_REASON

          FINDING-CAPTURE — turn each distinct defect into an agent-ready tracker issue so
          it feeds /tickets. This is an on-ramp: file directly (a human is present — no PR gate).

          1. Read the tracker contract first: `docs/agents/issue-tracker.md` and
             `docs/agents/triage-labels.md` in this repository.
             - **Access** — `issue-tracker.md` § Access names the MCP server or skill that serves this
               tracker. Read that server's own current tool list and build every call from it. Write
               no command, subcommand or flag here and name no provider, because a flag table
               frozen in this file is stale the moment the tool changes.
             - **Addressing** — its § Addressing names the repository these findings belong to. Name
               that repository explicitly in every call, and derive nothing from a remote URL.
             - **Work-item scope** — its § Work-item scope names the filter every search applies, and
               the scope every item you create carries.
             - **Roles** — `triage-labels.md` gives each role a value, the axis that carries it, and whether
               that axis **holds** one value or many. Name a role, resolve it there, and write no host field name
               yourself. Two rules follow from that table, and both are mandatory:
               - **A row with no axis writes nothing.** Report which role you resolved and that its row asks for
                 no write.
               - **A `state`, `type` or `priority` role is single-valued.** Only one role of a tier is true of an
                 item at a time. Before you write such a role, read the other rows of that tier and retract every
                 one whose axis holds many values. An axis that holds one value retracts the old value itself, so
                 there is nothing extra to do. Read `holds`, never the axis name: an axis name is a host word and
                 the next host spells it differently.
             If either file is absent, STOP and print "BLOCKED: this repository has no tracker
             contract at docs/agents/" and file nothing — the findings stay in $REJECTION_REASON.
          2. Decide single-issue vs breakdown this way: prefer many thin, independently fixable issues
             over one thick one; mark blocked-by relationships honestly; write from the user's
             perspective in the project's domain language; NO file paths or line numbers.
          3. For each finding, create a tracker issue:
               - Title: "QA: <slug> — <short defect summary>"
               - Roles: type `bug`, state `ready-for-agent`. The reviewer at this gate already vetted
                 the defect, so it is agent-ready — it needs no second /triage pass.
               - Body (the finding-capture brief shape): ## What happened / ## What I expected / ## Steps to reproduce /
                 ## Blocked by (issue #s or "None — can start immediately") / ## Additional context
                 (reference the failing AC-N and the test/e2e/coverage evidence, naming any that came
                 back "unresolved" as unresolved rather than as passing).
               - Prepend the mandated disclaimer as the first body line:
                 `> *This was generated by AI during QA.*`
          4. Print each created item's id, its URL and its blocking relationships, and this line:
             "Findings filed. They feed /unic-archon-dlc:tickets <slug> (or /build if already atomic).
              REJECT again to halt the QA run — the findings are now tracked — or APPROVE only if the
              defect is already fixed or non-blocking."
          Do NOT merge. Do NOT weaken any test.
        max_attempts: 1

  # ---------------------------------------------------------------------------------------------
  # verify-pr-base — read the PR state again, confirm the open PR targets the expected base, and name
  # every reason the merge cannot run. trigger_rule: all_done so it still runs when uat-gate is
  # SKIPPED in AFK mode (skipped counts as terminal); a rejected uat-gate cancels the whole run, so
  # this never runs on a rejected build. It never fails on a red result. guard-not-mergeable below
  # cancels the run instead.
  # ---------------------------------------------------------------------------------------------
  - id: verify-pr-base
    depends_on: [uat-gate]
    trigger_rule: all_done
    # always_run: true — pr_state and base_ok are facts about the remote PR, not about this node's
    # own exit code; a resume must re-query them, never reuse a cached verdict for a PR retargeted,
    # merged or closed since. Independent of trigger_rule above; both
    # apply.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the verify-pr-base node of /qa for slug "$bootstrap.output.slug".

      Expected base branch: $BASE_BRANCH

      UAT checklist from uat-prep, for reference only: $uat-prep.output
      <!-- This reference is deliberate. When uat-prep fails, Archon skips uat-gate, and this
      node still runs on all_done. Archon 0.12.1 fails a node whose prompt references a failed
      node's output, so a failed uat-prep fails this node and the run, and merge-gate never asks
      for a merge without a UAT. Keep it. -->

      ## The tracker contract
      `docs/agents/issue-tracker.md` in this repository is the tracker contract. Read it before the
      query. Its § Access names the MCP server or skill that serves this tracker. Read that server's own
      current tool list and build the call from it. Write no command, subcommand or flag here, and name
      no provider. Its § Addressing names the repository to query. Name that repository
      explicitly, and derive nothing from a remote URL.

      ## 1. The PR state
      A PR can be merged or closed during UAT, so read its state again. Query the PRs whose head is the
      current feature branch on that repository, in every state. Set `pr_state`:
        · a PR is open → "open"
        · no PR is open, and one is merged → "merged"
        · no PR is open or merged, and one is closed → "closed"
        · the query succeeds and finds no PR → "none"
        · the query fails, or the contract is missing or cannot target a repository explicitly →
          "unknown"
      Never guess a state. A query that did not answer is "unknown".

      ## 2. The base
      `base_ok` is "true" only when the open PR targets $BASE_BRANCH. Set it to the STRING "true" only
      when `pr_state` is "open" and the PR's target base equals $BASE_BRANCH. Set it to the STRING "false"
      in every other case, including when no PR is open and when the query failed. (It is a string, not
      a boolean, so the downstream `when` gates compare it reliably as `== 'true'`.) Set `actual_base`
      to the open PR's target branch, or to "" when no PR is open.

      ## 3. Every reason the merge cannot run
      The merge runs only when all of these hold: the test result "$test.output.result" is "pass", the
      e2e result "$e2e.output.result" is not "fail", the coverage-gate result
      "$coverage-gate.output.result" is not "fail", `pr_state` is "open", and `base_ok` is "true". An
      "unresolved" e2e or coverage-gate result does not block the merge.

      Set `blockers` to one sentence for EVERY condition that does not hold, in this order, joined with
      a space. Write all of them. One cause never replaces another.
        · test is not "pass" → "The test result is <result>, and a merge needs pass."
        · e2e is "fail" → "The e2e suite failed."
        · coverage-gate is "fail" → "The coverage gate failed."
        · `pr_state` is not "open" → the text for that state, word for word, with the placeholders
          filled:
            · none    → "No PR was ever opened for this branch. Fix the build and re-run /build."
            · merged  → "The PR for this branch is already merged. Nothing to do."
            · closed  → "The PR for this branch was closed without merging. Reopen it, or abandon the
              work."
            · unknown, failed query → "The PR state could not be read: <the error as received>.
              Check access to the tracker and re-run /qa."
            · unknown, missing or unusable contract → "The PR state could not be read:
              docs/agents/issue-tracker.md <is missing | cannot target a repository explicitly>. Add
              it with /unic-archon-dlc:setup."
        · `pr_state` is "open" and the base does not match → "The PR targets <actual> but <expected>
          was expected. Retarget it, then re-run /qa." Never say the PR is missing in this case.
      When every condition holds, set `blockers` to "".

      Print exactly one of these lines:
        - nothing blocks → "verify-pr-base: base is <actual> ✓"
        - otherwise → "verify-pr-base: the merge cannot run. <blockers> ✗"
    output_format:
      type: object
      properties:
        pr_state:
          type: string
          enum: [open, merged, closed, none, unknown]
        base_ok:
          type: string
          enum: ['true', 'false']
        actual_base: { type: string }
        blockers: { type: string }
      required: [pr_state, base_ok, actual_base, blockers]

  # ---------------------------------------------------------------------------------------------
  # guard-not-mergeable — its `when` is the exact negation of the `when` on `merge`, written against
  # the same outputs, so one of the two always holds. A run that cannot merge ends cancelled here
  # instead of skipping `merge` and ending completed. The message carries the results as well
  # as verify-pr-base's sentences, so the causes stay readable even if `blockers` came back short.
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-mergeable
    depends_on: [verify-pr-base]
    when: "$test.output.result != 'pass' || $e2e.output.result == 'fail' || $coverage-gate.output.result == 'fail' || $verify-pr-base.output.pr_state != 'open' || $verify-pr-base.output.base_ok != 'true'"
    cancel: >
      /qa did not merge "$bootstrap.output.slug". $verify-pr-base.output.blockers Results: test
      "$test.output.result", e2e "$e2e.output.result", coverage-gate "$coverage-gate.output.result",
      PR state "$verify-pr-base.output.pr_state", base_ok "$verify-pr-base.output.base_ok".

  # ---------------------------------------------------------------------------------------------
  # merge-gate — HITL by default; skipped in AFK. Its `when` is the gate check plus the conditions of
  # the `when` on `merge`, so it asks for approval only when `merge` would run.
  # ---------------------------------------------------------------------------------------------
  - id: merge-gate
    depends_on: [verify-pr-base]
    when: "$bootstrap.output.gate == 'hitl' && $test.output.result == 'pass' && $e2e.output.result != 'fail' && $coverage-gate.output.result != 'fail' && $verify-pr-base.output.pr_state == 'open' && $verify-pr-base.output.base_ok == 'true'"
    # Archon 0.12.1 substitutes node outputs in an approval message but not $BASE_BRANCH (measured), so
    # this message names the PR target through verify-pr-base's actual_base and the run
    # base through bootstrap's message, which starts with it.
    approval:
      message: >
        UAT approved for "$bootstrap.output.slug", and verify-pr-base passed. PR target:
        "$verify-pr-base.output.actual_base". $bootstrap.output.message
        The test result is "$test.output.result". Which checks could not run is written in
        <artifacts_dir>/<slug>/qa-checks.md. Approve to merge the PR through the tracker (and delete
        the feature branch on Gitflow). Reject to halt without merging.

  # ---------------------------------------------------------------------------------------------
  # merge — merge the PR through the tracker. trigger_rule: all_done so it runs when merge-gate
  # is SKIPPED in AFK; the `when` fail-closes so it NEVER runs on a red test/e2e/coverage, a PR that
  # is not open or a wrong base, in either mode. A rejected merge-gate cancels the run before this
  # node (max_attempts).
  #
  # The `test` clause reads `== 'pass'` while e2e and coverage read `!= 'fail'`, and that asymmetry is
  # the floor: `test` is the one need this gate cannot advance without, so an `unresolved` test
  # holds the merge, while an unresolved e2e or coverage reports and lets it through. Every node here
  # reports three states and `skip` is gone, so `!= 'fail'` no longer means "ran or was skipped" — it
  # means "did not fail", unresolved included, deliberately.
  # ---------------------------------------------------------------------------------------------
  - id: merge
    depends_on: [merge-gate]
    trigger_rule: all_done
    when: "$test.output.result == 'pass' && $e2e.output.result != 'fail' && $coverage-gate.output.result != 'fail' && $verify-pr-base.output.pr_state == 'open' && $verify-pr-base.output.base_ok == 'true'"
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the merge node of /qa for slug "$bootstrap.output.slug".

      ## The tracker contract
      `docs/agents/issue-tracker.md` and `docs/agents/triage-labels.md` in this repository are the
      tracker contract. This node is the one irreversible act in the lifecycle, and step 2 below writes
      a role, so read both before the merge call. Its § Access names the MCP server or skill
      that serves this tracker — read that server's own current tool list and build the call from it,
      writing no command, subcommand or flag here and naming no provider. Its § Addressing
      names the repository to merge in; name that repository explicitly, and derive nothing from a
      remote URL. If the file is absent, merge nothing, set `merged` to "false", and set `reason` to
      "BLOCKED: this repository has no tracker contract at docs/agents/issue-tracker.md. Add it with
      /unic-archon-dlc:setup, then re-run /qa."

      ## What this node reports
      Set `merged` to the STRING "true" only when the merge call returned success and the PR now reads
      as merged. Set it to the STRING "false" in every other case, and set `reason` to why:
        · the tracker contract is missing (the text above)
        · the tracker has no merge capability → say so, then give the manual steps for a human
          (merge the PR, then write the role `resolved` and the value its row gives on every linked
          item)
        · the branch policy refuses the merge → the refusal as received
        · the merge call errors → the error as received
        · the merge call returned success, but the PR state could not be read again → say so, give
          the error as received, and tell the operator to check the PR. If it merged, the operator
          writes the role `resolved` and the value its row gives on every linked item by hand,
          because a re-run of /qa reads the PR as merged and does nothing
        · the merge call returned success, but the PR is not merged yet, as under a merge queue or
          auto-merge → say so, and tell the operator to watch the PR. When it merges, the operator
          writes the role `resolved` and the value its row gives on every linked item by hand
      A "false" ends the run cancelled with `reason` as its message. Whenever `merged` is "false",
      the unconfirmed cases included, skip steps 2 and 3, so no item takes `resolved`. Say that in
      `reason`. When `merged` is "true", set `reason` to "".

      1. Merge the open PR for the current feature branch on that repository. **The merge style is the
         host's to enforce, not this Box's to choose.** Use whatever the repository's own branch policy
         allows; where it allows more than one, the team's `CLAUDE.md` states the rule — read it. Pick
         nothing yourself, and do not override a policy that refuses a style.
         If the tracker has no merge capability at all, merge nothing.
         Whenever `merged` is "false", skip steps 2 and 3.

      2. **After the merge lands, write the `resolved` role on every item the PR links.** Read the PR's
         links collection for them; nothing else is authoritative, and this is why `open-pr` created
         those links. This is the one point in the lifecycle where a state role moves after `/tickets`
         wrote `ready-for-agent` — so the retraction below is not optional here, it is the whole reason
         a merged item stops reading as ready for an agent.

         - **Roles** — `triage-labels.md` gives each role a value, the axis that carries it, and whether
           that axis **holds** one value or many. Name the role `resolved`, resolve it there, and write
           no host field name yourself. Two rules follow from that table, and both are mandatory:
           - **A row with no axis writes nothing.** If the `resolved` row asks for no write, write
             nothing and report that its row says so.
           - **A `state`, `type` or `priority` role is single-valued.** Only one role of a tier is true
             of an item at a time. Before you write `resolved`, read the other `state` rows and retract
             every one whose axis holds many values — `ready-for-agent` is the one that matters here.
             An axis that holds one value retracts the old value itself, so there is nothing extra to
             do. Read `holds`, never the axis name: an axis name is a host word and the next host
             spells it differently.

         The PR is already merged when this runs, so a failure here is reported and never retried into
         a second merge: print which items took the role, which were retracted, and which failed.

      3. On Gitflow ($bootstrap.output.branching == "gitflow"), after a successful merge: check out
      `$BASE_BRANCH` and delete the merged `feature/*` branch. Under any other branching model, leave branch
      cleanup to whatever auto-delete the host provides.

      Only when `merged` is "true", finally print:
      "merge: QA for \"$bootstrap.output.slug\" complete — <n> item(s) resolved. ✓"
      `<n>` counts only the items that took `resolved`. If writing `resolved` failed on some items,
      add " Not resolved: <their ids>." before the ✓. `/qa` never reverts a merge that landed, so the
      run still ends completed. When `merged` is "false", never print this line.
    output_format:
      type: object
      properties:
        merged:
          type: string
          enum: ['true', 'false']
        reason: { type: string }
      required: [merged, reason]

  # ---------------------------------------------------------------------------------------------
  # guard-not-merged — `merge` can run and still not confirm a merge (no tracker contract, no merge
  # capability, a branch policy that refuses, an error, a PR state it could not read again, or a
  # call that succeeded while the PR is not merged yet, as under a merge queue or auto-merge). Its
  # `when` is the exact negation of "merged", so such a run ends cancelled instead of completed.
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-merged
    depends_on: [merge]
    when: "$merge.output.merged != 'true'"
    cancel: >
      /qa could not confirm a merge for "$bootstrap.output.slug". $merge.output.reason
