name: unic-dlc-qa
description: >
  QA box + issue-producing on-ramp. Runs after /build's PR is approved: e2e → coverage-gate →
  UAT sign-off → verify-pr-base → merge, config-driven and generic. Two human gates (UAT + merge)
  honour gates.qa — HITL by default, AFK opt-in. When UAT surfaces a defect, it is filed directly as
  an agent-ready tracker item, through the contract at `docs/agents/issue-tracker.md` and
  `docs/agents/triage-labels.md` (ADR-0016/0024), so the finding feeds /tickets rather than only
  halting. Ported to the key-discriminated node
  schema (ADR-0011); inherits /build's self-contained-node conventions (ADR-0023 §5). See ADR-0025.

# Required at the workflow level so the UAT + merge approval messages reach the user (ADR-0011).
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config, confirm the QA baton exists.
  # A prompt node (NOT a script) so it needs no plugin-lib import and no $CLAUDE_PLUGIN_ROOT
  # (ADR-0023 §5): the agent reads .archon/unic-dlc.config.yaml with its own tools. The e2e command
  # and coverage threshold fall back qa.* → build.* so a team can run a heavier QA suite than build.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /qa workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug (kebab-case).
         If $ARGUMENTS is empty → status "no-slug".
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`          (default "workflows")
             `gates.qa`               (default "hitl")
             `qa.coverage_threshold`  (may be null) — else fall back to `build.coverage_threshold`
             `project.branching`      (default "gitflow")
             the whole `sdlc_needs` block
      3. Confirm the QA baton exists: `<artifacts_dir>/<slug>/PRD.md`. This is what /specs wrote and
         /build implemented — the acceptance criteria the UAT checklist is derived from.
         - If it is absent → status "no-prd".
      4. If slug, config, and PRD.md are all present → status "ready".

      Compute `expected_base` from branching: "develop" when branching == "gitflow", else "main".
      `coverage_threshold` is the resolved (qa.* ?? build.*) value — null when neither is set.

      ## The `sdlc_needs` block — a key names a need, never a tool
      Every key in it names a NEED of this project's development process. `test` names the need;
      whichever runner this project uses is the tool that serves it, and this Box names none. Pass the
      block downstream as ONE object, exactly as you read it, adding and removing no key and rewriting
      no value. Infer nothing: a need this project leaves null stays null, and becomes an unresolved
      check further down, which is honest — a fabricated command reports a result that means nothing.
      Where the config carries no `sdlc_needs` block at all, emit the object with all nine keys null.
      There is no per-Box override any more: the retired `qa.e2e_command` / `build.e2e_command` pair is
      replaced by the single `sdlc_needs.e2e`, and a config still carrying those keys is ignored.

      ## Install once, and say what you did
      One Archon worktree serves this whole run and may or may not already carry this project's
      dependencies. So install here, once, and nowhere else. When status is "ready", run
      `sdlc_needs.install` from the repo root if it is declared, and set `install_report` to:
        - declared, exit 0     → "ran the declared install command: ok"
        - declared, non-zero   → "ran the declared install command: FAILED — <what it printed>"
        - not declared         → "sdlc_needs.install is not declared, so nothing was installed.
                                  Dependencies may still be present in this worktree by chance, and a
                                  later green check here is not proof of a deliberately built
                                  environment."
      A failed install does not fail this node — report it and carry on. On any status other than
      "ready", set `install_report` to "not attempted (<status>)".

      Emit ONLY the structured object.

      ALWAYS emit EVERY required field, including in the no-slug / no-config / no-prd branches, so the
      object validates before a guard can cancel. When a value cannot be read (e.g. config is
      missing), fall back to: slug "" (if no-slug), artifacts_dir "workflows", gate "hitl", branching
      "gitflow", expected_base "develop". Set `message` to a human-readable reason for any non-ready
      status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config, no-prd]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        coverage_threshold: { type: [number, 'null'] }
        sdlc_needs:
          type: object
          properties:
            install: { type: [string, 'null'] }
            build: { type: [string, 'null'] }
            test: { type: [string, 'null'] }
            e2e: { type: [string, 'null'] }
            lint: { type: [string, 'null'] }
            format: { type: [string, 'null'] }
            typecheck: { type: [string, 'null'] }
            dev: { type: [string, 'null'] }
            coverage: { type: [string, 'null'] }
          required: [install, build, test, e2e, lint, format, typecheck, dev, coverage]
        install_report: { type: string }
        branching: { type: string }
        expected_base: { type: string }
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, sdlc_needs, install_report, expected_base, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly (ADR-0011: cancel vs fail). One guard,
  # because there is no repository to resolve: `docs/agents/issue-tracker.md` names it, which matters
  # most here — this is the Box that MERGES.
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /qa preconditions not met — see the bootstrap output for which of slug, config, or
      <artifacts_dir>/<slug>/PRD.md is missing. Run /unic-archon-dlc:build <slug> first (which in turn
      needs /specs + /tickets), so the acceptance criteria the UAT checklist reads from exist.

  # ---------------------------------------------------------------------------------------------
  # e2e — run the configured end-to-end suite. A prompt node (ADR-0023 §5): it reads the resolved
  # command from bootstrap and runs it with its own tools. It REPORTS a verdict (does not hard-fail);
  # a failing e2e surfaces in the UAT checklist and fail-closes the merge `when` below, so a red build
  # can never auto-merge even in AFK mode.
  # ---------------------------------------------------------------------------------------------
  - id: test
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    # always_run: true — the result is a fact about the CURRENT branch; a resume must re-run it
    # rather than replay a cached pass from before the code changed underneath it (ADR-0033).
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the test node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** `test` is the need; whichever runner this project uses is the tool that serves
      it. Run exactly the command the key holds, append no flag of your own, and fabricate nothing for
      a key that is null.

      Run the `test` key of `$bootstrap.output.sdlc_needs` from the repo root, capture pass/fail
      counts, and set `result`:
        · the key is null, or its command will not run → "unresolved"
        · exit 0 → "pass"
        · non-zero → "fail"; include the failing tests in `summary`
      This node exists to produce a test outcome, so it always WANTS one: a null key is "unresolved"
      and never a silent skip. That distinction is what the merge gate reads. A "pass" reporting ZERO
      tests goes in `summary` as **suspicious** rather than as a green result — that is the shape a
      command declared against the wrong target takes.
      Print a one-line verdict:  "test: PASSED ✓" / "test: FAILED ✗ — <detail>" /
      "test: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # e2e — the end-to-end suite. Reports a verdict rather than hard-failing; a real failure fail-closes
  # the merge below and reaches the human at UAT first.
  # ---------------------------------------------------------------------------------------------
  - id: e2e
    depends_on: [test]
    when: "$bootstrap.output.status == 'ready'"
    # always_run: true — the result is a fact about the CURRENT branch; a resume must re-run it
    # rather than replay a cached pass from before the code changed underneath it (ADR-0033).
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the e2e node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** Run exactly the command the key holds, append no flag of your own, and fabricate
      nothing for a key that is null.

      Run the `e2e` key of `$bootstrap.output.sdlc_needs` from the repo root and capture pass/fail
      counts, then set `result`:
        · the key is null, or its command will not run → "unresolved"
        · exit 0 → "pass"
        · non-zero → "fail"; include the failing tests in `summary`
      This node exists to run the end-to-end suite, so it always WANTS one: a null key is "unresolved",
      never a skip. Unresolved is non-blocking here — only the test floor holds the merge — but it is
      reported, because an absent result and a green result are not the same fact.
      Print a one-line verdict:  "e2e: PASSED ✓" / "e2e: FAILED ✗ — <detail>" /
      "e2e: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # coverage-gate — enforce the coverage threshold if one is configured; skip cleanly otherwise.
  # Reports a verdict like e2e (fail-closes the merge `when`, never hard-fails the run).
  # ---------------------------------------------------------------------------------------------
  - id: coverage-gate
    depends_on: [e2e]
    # always_run: true — same reason as e2e: coverage is a fact about the CURRENT tree, not a
    # promise carried by exit code 0 (ADR-0033).
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the coverage-gate node of /qa for slug "$bootstrap.output.slug".

      **A key in `$bootstrap.output.sdlc_needs` names a NEED of this project's development process,
      never a tool.** Run exactly the command the `coverage` key holds. Append no coverage flag of your
      own to `test` or to any other declared command — `coverage` is a need of its own precisely so
      that nobody has to guess how this project asks its runner for a figure.

      Two values decide this node: the `coverage` key of `$bootstrap.output.sdlc_needs`, which produces
      the figure, and `$bootstrap.output.coverage_threshold`, which the figure is compared against.
      Set `result`:
        · either value is null, or the command will not run, or the figure cannot be parsed →
          "unresolved"
        · figure ≥ threshold → result "pass"
        · figure < threshold, or the command exits non-zero → result "fail"
      This node exists to gate on coverage, so it always WANTS a figure: a null key or a null threshold
      is "unresolved", never a skip. Unresolved is non-blocking here — only the test floor holds the
      merge — but it is reported, because a threshold nobody could measure against is not a pass.
      Print a one-line verdict:  "coverage-gate: PASSED (<n>%)" / "coverage-gate: FAILED (<n>% <
      <threshold>%)" / "coverage-gate: UNRESOLVED — <why>".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, unresolved]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # uat-prep — build the UAT checklist from the PRD's acceptance criteria + /build's report. Must be
  # a prompt node: approval nodes run no AI, so the checklist is computed here and printed, then the
  # uat-gate approval references it. Runs in both hitl and afk (a durable record either way).
  # ---------------------------------------------------------------------------------------------
  - id: uat-prep
    depends_on: [coverage-gate]
    context: fresh
    # Write is here for one reason: this node files the check block into the Session dir. /qa has no
    # report node, and its console output dies with the worktree, so a block that exists only in
    # scrollback satisfies nothing — this is the one surface in this Box a human reads afterwards.
    allowed_tools: [Read, Bash, Glob, Write]
    prompt: |
      You are the uat-prep node of /qa for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        Session dir   = <ARTIFACTS_DIR>/<SLUG>/

      1. Read `<ARTIFACTS_DIR>/<SLUG>/PRD.md`. Extract every acceptance criterion (from the User
         Stories' "Acceptance criteria:" bullets and any "## Acceptance Criteria" section). Number
         them AC-1, AC-2, …
      2. Read `<ARTIFACTS_DIR>/<SLUG>/report.md` if it exists — it holds /build's goals-check coverage
         matrix and test outcomes.
      3. WRITE `<ARTIFACTS_DIR>/<SLUG>/qa-checks.md`, then print the same content (the uat-gate
         approval message points the reviewer at it). Write it as well as print it: this Box has no
         report node, so anything only printed here dies with the worktree and reaches nobody who
         reviews this run later.

           === Checks That Could Not Run ===
           <one line per need whose result is "unresolved", naming the need and why>
           <$bootstrap.output.install_report, verbatim>

           === UAT Checklist for <SLUG> ===
           AC-N: <criterion text>
             Evidence: <matching row from the coverage matrix, or "not recorded">
             [ ] Verified by human
           …
           test result:     <PASSED | FAILED | UNRESOLVED>   ($test.output.result)
           e2e result:      <PASSED | FAILED | UNRESOLVED>   ($e2e.output.result)
           coverage result: <PASSED | FAILED | UNRESOLVED>   ($coverage-gate.output.result)

         The first block comes first and stays even when nothing is unresolved — write "every declared
         check ran" then. A check nobody could run is the fact a reader skips past when it sits in a
         paragraph, which is why it is a block of its own and why it goes above the checklist.

      Emit the numbered criteria as structured output so the finding-capture step can reference them
      by number when a defect is rejected.
    output_format:
      type: object
      properties:
        criteria:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              evidence: { type: string }
            required: [id, text]
      required: [criteria]

  # ---------------------------------------------------------------------------------------------
  # uat-gate — HITL by default; skipped when gates.qa == afk. On REJECT, on_reject captures the
  # failing criteria as agent-ready tracker issues (finding-capture, ADR-0025) BEFORE the run halts,
  # so the defect is durably tracked and feeds /tickets — not lost when the workflow cancels.
  # max_attempts: 1 → capture once, then a second reject cancels the run.
  #
  # The finding-capture brief shape below (what happened / what I expected / steps to reproduce /
  # blocked by / additional context) and the thin-issues heuristic above it were originally Matt
  # Pocock's `qa` Method. Upstream v1.1.0 moved `qa` to `skills/deprecated/` with no replacement, so
  # there is nothing left to resolve by name: the shape is inlined verbatim here and this Harness owns
  # it from now on. It is deliberately absent from the Method table in the `unic-archon-dlc` Plugin's
  # own README.md § Dependencies — not this repository's README, which is a Consumer's — because an
  # entry there would point at a dead upstream branch (#281, #381, #401).
  # ---------------------------------------------------------------------------------------------
  - id: uat-gate
    depends_on: [uat-prep]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        UAT for "$bootstrap.output.slug": review the UAT checklist printed by uat-prep above against
        the e2e and coverage-gate results. APPROVE to proceed to PR-base verification and merge.
        REJECT with the failing item(s) (e.g. "AC-3: totals wrong for empty cart") — I will file each
        as an agent-ready issue on the tracker, then the gate re-pauses so you can REJECT again to halt.
      on_reject:
        prompt: |
          The reviewer rejected UAT for "$bootstrap.output.slug" with this feedback:
          $REJECTION_REASON

          FINDING-CAPTURE (ADR-0025) — turn each distinct defect into an agent-ready tracker issue so
          it feeds /tickets. This is an on-ramp: file directly (a human is present — no PR gate).

          1. Read the tracker contract first: `docs/agents/issue-tracker.md` and
             `docs/agents/triage-labels.md` in this repository.
             - **Access** — `issue-tracker.md` § Access names the MCP server or skill that serves this
               tracker. Read that server's own current tool list and build every call from it. Write
               no command, subcommand or flag here and name no provider (ADR-0016): a flag table
               frozen in this file is stale the moment the tool changes.
             - **Addressing** — its § Addressing names the repository these findings belong to. Name
               that repository explicitly in every call, and derive nothing from a remote URL.
             - **Work-item scope** — its § Work-item scope names the filter every search applies, and
               the scope every item you create carries.
             - **Roles** — `triage-labels.md` gives each role a value, the axis that carries it, and whether
               that axis **holds** one value or many. Name a role, resolve it there, and write no host field name
               yourself. Two rules follow from that table, and both are mandatory:
               - **A row with no axis writes nothing.** Report which role you resolved and that its row asks for
                 no write.
               - **A `state`, `type` or `priority` role is single-valued.** Only one role of a tier is true of an
                 item at a time. Before you write such a role, read the other rows of that tier and retract every
                 one whose axis holds many values. An axis that holds one value retracts the old value itself, so
                 there is nothing extra to do. Read `holds`, never the axis name: an axis name is a host word and
                 the next host spells it differently.
             If either file is absent, STOP and print "BLOCKED: this repository has no tracker
             contract at docs/agents/" and file nothing — the findings stay in $REJECTION_REASON.
          2. Decide single-issue vs breakdown this way: prefer many thin, independently fixable issues
             over one thick one; mark blocked-by relationships honestly; write from the user's
             perspective in the project's domain language; NO file paths or line numbers.
          3. For each finding, create a tracker issue:
               - Title: "QA: <slug> — <short defect summary>"
               - Roles: type `bug`, state `ready-for-agent`. The reviewer at this gate already vetted
                 the defect, so it is agent-ready — it needs no second /triage pass (ADR-0025).
               - Body (the finding-capture brief shape): ## What happened / ## What I expected / ## Steps to reproduce /
                 ## Blocked by (issue #s or "None — can start immediately") / ## Additional context
                 (reference the failing AC-N and the e2e/coverage evidence).
               - Prepend the mandated disclaimer as the first body line:
                 `> *This was generated by AI during QA.*`
          4. Print each created item's id, its URL and its blocking relationships, and this line:
             "Findings filed. They feed /unic-archon-dlc:tickets <slug> (or /build if already atomic).
              REJECT again to halt the QA run — the findings are now tracked — or APPROVE only if the
              defect is already fixed or non-blocking."
          Do NOT merge. Do NOT weaken any test.
        max_attempts: 1

  # ---------------------------------------------------------------------------------------------
  # verify-pr-base — confirm the open PR targets the expected base before merge. trigger_rule:
  # all_done so it still runs when uat-gate is SKIPPED in AFK mode (skipped counts as terminal); a
  # rejected uat-gate cancels the whole run, so this never runs on a rejected build. Reports base_ok;
  # the merge `when` fail-closes on a wrong base rather than this node failing.
  # ---------------------------------------------------------------------------------------------
  - id: verify-pr-base
    depends_on: [uat-gate]
    trigger_rule: all_done
    # always_run: true — base_ok is a fact about the remote PR, not about this node's own exit
    # code; a resume must re-query it, never reuse a cached verdict for a PR retargeted since
    # (the exact hole ADR-0033 closes). Independent of trigger_rule above; both apply.
    always_run: true
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the verify-pr-base node of /qa for slug "$bootstrap.output.slug".

      Expected base branch: $bootstrap.output.expected_base

      ## The tracker contract
      `docs/agents/issue-tracker.md` and `docs/agents/triage-labels.md` in this repository are the
      tracker contract. This node needs the first. Read it before the query. Its § Access names the MCP server or skill that serves this tracker — read that server's
      own current tool list and build the call from it, writing no command, subcommand or flag here
      and naming no provider (ADR-0016). Its § Addressing names the repository to query; name that
      repository explicitly, and derive nothing from a remote URL. If the file is absent, or the
      tracker cannot target a repository explicitly, treat the base as unverifiable (below) and say
      which was the reason.

      Query the open PR for the current feature branch on that repository and read its target base
      branch.

      Set `base_ok` to the STRING "true" when the actual base equals expected_base; the STRING "false"
      on a genuine mismatch. (It is a string, not a boolean, so the downstream `when` gates compare it
      reliably as `== 'true'`.) When the tracker has no queryable PR at all, set `base_ok` "true" and
      note that the base is unverifiable here — a warning, non-blocking. Print
      "verify-pr-base: base is <actual> ✓" or "verify-pr-base: PR targets <actual> but expected
      <expected> ✗ — retarget first."
    output_format:
      type: object
      properties:
        base_ok:
          type: string
          enum: ['true', 'false']
        actual_base: { type: string }
      required: [base_ok]

  # ---------------------------------------------------------------------------------------------
  # merge-gate — HITL by default; skipped in AFK. Only pauses when the base is verified good, so an
  # approval is never solicited for a merge that would be blocked anyway.
  # ---------------------------------------------------------------------------------------------
  - id: merge-gate
    depends_on: [verify-pr-base]
    when: "$bootstrap.output.gate == 'hitl' && $verify-pr-base.output.base_ok == 'true'"
    approval:
      message: >
        UAT approved and PR base verified as "$bootstrap.output.expected_base" for
        "$bootstrap.output.slug". The test result is "$test.output.result" — a merge needs "pass", and
        an unresolved test holds this gate however clean the rest reads. Which checks could not run is
        written in <artifacts_dir>/<slug>/qa-checks.md. Approve to merge the PR through the tracker
        (and delete the feature branch on Gitflow). Reject to halt without merging.

  # ---------------------------------------------------------------------------------------------
  # merge — merge the PR through the tracker. trigger_rule: all_done so it runs when merge-gate
  # is SKIPPED in AFK; the `when` fail-closes so it NEVER runs on a red test/e2e/coverage or a wrong
  # base, in either mode. A rejected merge-gate cancels the run before this node (max_attempts).
  #
  # The `test` clause reads `== 'pass'` while e2e and coverage read `!= 'fail'`, and that asymmetry is
  # the floor (#430): `test` is the one need this gate cannot advance without, so an `unresolved` test
  # holds the merge, while an unresolved e2e or coverage reports and lets it through. Every node here
  # reports three states and `skip` is gone, so `!= 'fail'` no longer means "ran or was skipped" — it
  # means "did not fail", unresolved included, deliberately.
  # ---------------------------------------------------------------------------------------------
  - id: merge
    depends_on: [merge-gate]
    trigger_rule: all_done
    when: "$test.output.result == 'pass' && $e2e.output.result != 'fail' && $coverage-gate.output.result != 'fail' && $verify-pr-base.output.base_ok == 'true'"
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the merge node of /qa for slug "$bootstrap.output.slug".

      ## The tracker contract
      `docs/agents/issue-tracker.md` and `docs/agents/triage-labels.md` in this repository are the
      tracker contract. This node is the one irreversible act in the lifecycle, and step 2 below writes
      a role, so read both before the merge call. Its § Access names the MCP server or skill
      that serves this tracker — read that server's own current tool list and build the call from it,
      writing no command, subcommand or flag here and naming no provider (ADR-0016). Its § Addressing
      names the repository to merge in; name that repository explicitly, and derive nothing from a
      remote URL. If the file is absent, STOP and print "BLOCKED: this repository has no tracker
      contract at docs/agents/issue-tracker.md" and merge nothing.

      1. Merge the open PR for the current feature branch on that repository. **The merge style is the
         host's to enforce, not this Box's to choose.** Use whatever the repository's own branch policy
         allows; where it allows more than one, the team's `CLAUDE.md` states the rule — read it. Pick
         nothing yourself, and do not override a policy that refuses a style.
         If the tracker has no merge capability at all, merge nothing, skip step 2, and print the manual
         steps for a human instead — including the role `resolved` and the value its row gives.

      2. **After the merge lands, write the `resolved` role on every item the PR links.** Read the PR's
         links collection for them; nothing else is authoritative, and this is why `open-pr` created
         those links. This is the one point in the lifecycle where a state role moves after `/tickets`
         wrote `ready-for-agent` — so the retraction below is not optional here, it is the whole reason
         a merged item stops reading as ready for an agent.

         - **Roles** — `triage-labels.md` gives each role a value, the axis that carries it, and whether
           that axis **holds** one value or many. Name the role `resolved`, resolve it there, and write
           no host field name yourself. Two rules follow from that table, and both are mandatory:
           - **A row with no axis writes nothing.** If the `resolved` row asks for no write, write
             nothing and report that its row says so.
           - **A `state`, `type` or `priority` role is single-valued.** Only one role of a tier is true
             of an item at a time. Before you write `resolved`, read the other `state` rows and retract
             every one whose axis holds many values — `ready-for-agent` is the one that matters here.
             An axis that holds one value retracts the old value itself, so there is nothing extra to
             do. Read `holds`, never the axis name: an axis name is a host word and the next host
             spells it differently.

