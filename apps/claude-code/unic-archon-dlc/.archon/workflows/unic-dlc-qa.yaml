name: unic-dlc-qa
description: >
  QA box + issue-producing on-ramp. Runs after /build's PR is approved: e2e → coverage-gate →
  UAT sign-off → verify-pr-base → merge, config-driven and generic. Two human gates (UAT + merge)
  honour gates.qa — HITL by default, AFK opt-in. When UAT surfaces a defect, it is filed directly as
  an agent-ready tracker issue (composing the configured tracker + classification.labels, ADR-0016/
  0024) so the finding feeds /tickets, rather than only halting. Ported to the key-discriminated node
  schema (ADR-0011); inherits /build's self-contained-node conventions (ADR-0023 §5). See ADR-0025.

# Required at the workflow level so the UAT + merge approval messages reach the user (ADR-0011).
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config, confirm the QA baton exists.
  # A prompt node (NOT a script) so it needs no plugin-lib import and no $CLAUDE_PLUGIN_ROOT
  # (ADR-0023 §5): the agent reads .archon/unic-dlc.config.yaml with its own tools. The e2e command
  # and coverage threshold fall back qa.* → build.* so a team can run a heavier QA suite than build.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /qa workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug (kebab-case).
         If $ARGUMENTS is empty → status "no-slug".
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`          (default "workflows")
             `gates.qa`               (default "hitl")
             `qa.e2e_command`         (may be null) — else fall back to `build.e2e_command`
             `qa.coverage_threshold`  (may be null) — else fall back to `build.coverage_threshold`
             `tracker.type`           (e.g. github / ado / jira / local-markdown)
             `project.branching`      (default "gitflow")
             `project.repo_ref`       (OPTIONAL, may be absent or null)
      3. Confirm the QA baton exists: `<artifacts_dir>/<slug>/PRD.md`. This is what /specs wrote and
         /build implemented — the acceptance criteria the UAT checklist is derived from.
         - If it is absent → status "no-prd".
      4. If slug, config, and PRD.md are all present → status "ready".

      Compute `expected_base` from branching: "develop" when branching == "gitflow", else "main".
      Emit ONLY the structured object. `e2e_command` / `coverage_threshold` are the resolved
      (qa.* ?? build.*) values — null when neither is set (→ the node skips with a warning).

      `project.repo_ref` is the host-agnostic repository reference every PR-touching node pins its CLI
      call to — "OWNER/REPO" (optionally "HOST/OWNER/REPO") for github, "PROJECT/REPO" for ado. Emit it
      VERBATIM as `repo_ref`, with no normalising, splitting or host-qualifying: only the consuming node
      knows which flag it belongs to. When the key is absent, null or empty, emit `repo_ref` "" and
      `repo_ref_present` "false"; otherwise the value and "true". `repo_ref_present` is the STRING
      "true"/"false" (an enum) so the `guard-no-repo-ref` condition compares it reliably.

      ALWAYS emit EVERY required field, including in the no-slug / no-config / no-prd branches, so the
      object validates before `guard-not-ready` can cancel. When a value cannot be read (e.g. config is
      missing), fall back to: slug "" (if no-slug), artifacts_dir "workflows", gate "hitl",
      tracker_type "" , branching "gitflow", expected_base "develop", repo_ref "", repo_ref_present
      "false". Set `message` to a human-readable reason for any non-ready status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config, no-prd]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        e2e_command: { type: [string, 'null'] }
        coverage_threshold: { type: [number, 'null'] }
        tracker_type: { type: string }
        branching: { type: string }
        expected_base: { type: string }
        repo_ref: { type: string }
        repo_ref_present:
          type: string
          enum: ['true', 'false']
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, tracker_type, expected_base, repo_ref, repo_ref_present, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly (ADR-0011: cancel vs fail).
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /qa preconditions not met — see the bootstrap output for which of slug, config, or
      <artifacts_dir>/<slug>/PRD.md is missing. Run /unic-archon-dlc:build <slug> first (which in turn
      needs /specs + /tickets), so the acceptance criteria the UAT checklist reads from exist.

  # ---------------------------------------------------------------------------------------------
  # guard-no-repo-ref — an unpinned repository is an EXPECTED precondition failure, so it cancels
  # rather than fails (ADR-0011), exactly like guard-not-ready above. /qa is the box that MERGES, so an
  # inferred repository is at its most dangerous here: it cancels before the e2e suite runs rather than
  # discovering the problem at verify-pr-base (#289).
  # ---------------------------------------------------------------------------------------------
  - id: guard-no-repo-ref
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready' && $bootstrap.output.repo_ref_present == 'false'"
    cancel: >
      /qa cannot run: `project.repo_ref` is not set in `.archon/unic-dlc.config.yaml`. It is the
      repository whose PR is verified and merged — "OWNER/REPO" (or "HOST/OWNER/REPO") for github,
      "PROJECT/REPO" for ado. Without it `gh`/`az` infers the repository from the checkout, which in a
      fork clone is the upstream parent. Add it under `project:` (or re-run /unic-archon-dlc:setup) and
      start /qa again.

  # ---------------------------------------------------------------------------------------------
  # e2e — run the configured end-to-end suite. A prompt node (ADR-0023 §5): it reads the resolved
  # command from bootstrap and runs it with its own tools. It REPORTS a verdict (does not hard-fail);
  # a failing e2e surfaces in the UAT checklist and fail-closes the merge `when` below, so a red build
  # can never auto-merge even in AFK mode.
  # ---------------------------------------------------------------------------------------------
  - id: e2e
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the e2e node of /qa for slug "$bootstrap.output.slug".

      The configured e2e command is: $bootstrap.output.e2e_command
      - If it is null/empty → print "e2e: no e2e_command configured (qa.e2e_command / build.e2e_command)
        — SKIPPED." and set result "skip". This is non-blocking.
      - Otherwise run that exact command from the repo root and capture pass/fail counts.
          · exit 0 → result "pass".
          · non-zero → result "fail"; include the failing tests in `summary`.
      Print a one-line verdict:  "e2e: PASSED ✓" / "e2e: FAILED ✗ — <detail>" / "e2e: SKIPPED".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, skip]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # coverage-gate — enforce the coverage threshold if one is configured; skip cleanly otherwise.
  # Reports a verdict like e2e (fail-closes the merge `when`, never hard-fails the run).
  # ---------------------------------------------------------------------------------------------
  - id: coverage-gate
    depends_on: [e2e]
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the coverage-gate node of /qa for slug "$bootstrap.output.slug".

      The configured coverage threshold is: $bootstrap.output.coverage_threshold
      - If it is null → print "coverage-gate: no coverage_threshold configured — SKIPPED." and set
        result "skip".
      - Otherwise run the repo's test suite with coverage (prefer the project's coverage script; e.g.
        `pnpm test --coverage`). Parse the total statement/line coverage %.
          · coverage ≥ threshold → result "pass".
          · coverage < threshold, or the suite exits non-zero → result "fail".
          · coverage % unparseable but suite passed → result "pass" (note it could not be parsed).
      Print a one-line verdict:  "coverage-gate: PASSED (<n>%)" / "coverage-gate: FAILED (<n>% <
      <threshold>%)" / "coverage-gate: SKIPPED".
    output_format:
      type: object
      properties:
        result:
          type: string
          enum: [pass, fail, skip]
        summary: { type: string }
      required: [result, summary]

  # ---------------------------------------------------------------------------------------------
  # uat-prep — build the UAT checklist from the PRD's acceptance criteria + /build's report. Must be
  # a prompt node: approval nodes run no AI, so the checklist is computed here and printed, then the
  # uat-gate approval references it. Runs in both hitl and afk (a durable record either way).
  # ---------------------------------------------------------------------------------------------
  - id: uat-prep
    depends_on: [coverage-gate]
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the uat-prep node of /qa for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        Session dir   = <ARTIFACTS_DIR>/<SLUG>/

      1. Read `<ARTIFACTS_DIR>/<SLUG>/PRD.md`. Extract every acceptance criterion (from the User
         Stories' "Acceptance criteria:" bullets and any "## Acceptance Criteria" section). Number
         them AC-1, AC-2, …
      2. Read `<ARTIFACTS_DIR>/<SLUG>/report.md` if it exists — it holds /build's goals-check coverage
         matrix and test outcomes.
      3. Print the checklist verbatim (the uat-gate approval message points the reviewer at it):

           === UAT Checklist for <SLUG> ===
           AC-N: <criterion text>
             Evidence: <matching row from the coverage matrix, or "not recorded">
             [ ] Verified by human
           …
           e2e result:      <PASSED | FAILED | SKIPPED>   (from the e2e node output above)
           coverage result: <PASSED | FAILED | SKIPPED>   (from the coverage-gate node output above)

      Emit the numbered criteria as structured output so the finding-capture step can reference them
      by number when a defect is rejected.
    output_format:
      type: object
      properties:
        criteria:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              text: { type: string }
              evidence: { type: string }
            required: [id, text]
      required: [criteria]

  # ---------------------------------------------------------------------------------------------
  # uat-gate — HITL by default; skipped when gates.qa == afk. On REJECT, on_reject captures the
  # failing criteria as agent-ready tracker issues (finding-capture, ADR-0025) BEFORE the run halts,
  # so the defect is durably tracked and feeds /tickets — not lost when the workflow cancels.
  # max_attempts: 1 → capture once, then a second reject cancels the run.
  #
  # The finding-capture brief shape below (what happened / what I expected / steps to reproduce /
  # blocked by / additional context) and the thin-issues heuristic above it were originally Matt
  # Pocock's `qa` Method. Upstream v1.1.0 moved `qa` to `skills/deprecated/` with no replacement, so
  # there is nothing left to resolve by name: the shape is inlined verbatim here and this Harness owns
  # it from now on. It is deliberately NOT in lib/methods-manifest.mjs — a manifest entry would point
  # at a dead upstream branch (#281).
  # ---------------------------------------------------------------------------------------------
  - id: uat-gate
    depends_on: [uat-prep]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        UAT for "$bootstrap.output.slug": review the UAT checklist printed by uat-prep above against
        the e2e and coverage-gate results. APPROVE to proceed to PR-base verification and merge.
        REJECT with the failing item(s) (e.g. "AC-3: totals wrong for empty cart") — I will file each
        as an agent-ready issue on the tracker, then the gate re-pauses so you can REJECT again to halt.
      on_reject:
        prompt: |
          The reviewer rejected UAT for "$bootstrap.output.slug" with this feedback:
          $REJECTION_REASON

          FINDING-CAPTURE (ADR-0025) — turn each distinct defect into an agent-ready tracker issue so
          it feeds /tickets. This is an on-ramp: file directly (a human is present — no PR gate).

          1. Read `.archon/unic-dlc.config.yaml` for `tracker` (type/access/coords) and
             `classification.labels`. Compose the tracker MCP-first, CLI-fallback (gh / az / jira, or
             the azure-devops-cli skill) — never hardcode a host (ADR-0016). Labels come ONLY from
             `classification.labels` (single source of truth — ADR-0024); do NOT read
             docs/agents/triage-labels.md or issue-tracker.md.
             PIN every call to REPO_REF = $bootstrap.output.repo_ref — an unpinned CLI infers the
             repository from the checkout, which in a fork clone is the upstream parent, and the defect
             would be filed in someone else's tracker. The reference is host-agnostic and only the FLAG
             differs: `gh issue create --repo "<REPO_REF>"` for github; for ado, the `az repos` /
             `az boards` flag the subcommand takes (`--repository` where one exists) plus the
             `--organization` / `--project` coords from `tracker.coords`.
          2. Decide single-issue vs breakdown this way: prefer many thin, independently fixable issues
             over one thick one; mark blocked-by relationships honestly; write from the user's
             perspective in the project's domain language; NO file paths or line numbers.
          3. For each finding, create a tracker issue:
               - Title: "QA: <slug> — <short defect summary>"
               - Labels: type `bug` + state `ready-for-agent` (resolved through classification.labels).
                 The reviewer at this gate already vetted the defect, so it is agent-ready — it needs no
                 second /triage pass (ADR-0025).
               - Body (the finding-capture brief shape): ## What happened / ## What I expected / ## Steps to reproduce /
                 ## Blocked by (issue #s or "None — can start immediately") / ## Additional context
                 (reference the failing AC-N and the e2e/coverage evidence).
               - Prepend the mandated disclaimer as the first body line:
                 `> *This was generated by AI during QA.*`
          4. Print each created issue URL and its blocking relationships, and this line:
             "Findings filed. They feed /unic-archon-dlc:tickets <slug> (or /build if already atomic).
              REJECT again to halt the QA run — the findings are now tracked — or APPROVE only if the
              defect is already fixed or non-blocking."
          Do NOT merge. Do NOT weaken any test.
        max_attempts: 1

  # ---------------------------------------------------------------------------------------------
  # verify-pr-base — confirm the open PR targets the expected base before merge. trigger_rule:
  # all_done so it still runs when uat-gate is SKIPPED in AFK mode (skipped counts as terminal); a
  # rejected uat-gate cancels the whole run, so this never runs on a rejected build. Reports base_ok;
  # the merge `when` fail-closes on a wrong base rather than this node failing.
  # ---------------------------------------------------------------------------------------------
  - id: verify-pr-base
    depends_on: [uat-gate]
    trigger_rule: all_done
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the verify-pr-base node of /qa for slug "$bootstrap.output.slug".

      Expected base branch: $bootstrap.output.expected_base   (tracker: $bootstrap.output.tracker_type)
      REPO_REF = $bootstrap.output.repo_ref

      Query the open PR for the current feature branch and read its target/base branch, composing the
      tracker from `.archon/unic-dlc.config.yaml` (MCP-first, CLI-fallback). PIN every call to REPO_REF —
      an unpinned CLI infers the repository from the checkout, which in a fork clone is the upstream
      parent, so you would verify the base of a PR in the wrong repository. The reference is
      host-agnostic and only the FLAG differs (ADR-0016):
        - github → `gh pr view --repo "<REPO_REF>" --json baseRefName`
        - ado    → find the PR with `az repos pr list --repository "<REPO_REF>"`, then read
          `targetRefName` from `az repos pr show --id <id>` (strip `refs/heads/`). Pass the repository
          through the flag the subcommand actually takes: `--repository` where one exists, `--id` where
          the PR identifies itself; add the `--organization` / `--project` coords from `tracker.coords`
        - jira / local-markdown / other → no queryable PR base: set base_ok "true" and note it is
          unverifiable for this tracker (warning only, non-blocking).
      REPO_REF is guaranteed non-empty here: `guard-no-repo-ref` cancelled the run otherwise.
      Set `base_ok` to the STRING "true" when the actual base equals expected_base (or is unverifiable
      as above); the STRING "false" on a genuine mismatch. (It is a string, not a boolean, so the
      downstream `when` gates compare it reliably as `== 'true'`.) Print "verify-pr-base: base is
      <actual> ✓" or "verify-pr-base: PR targets <actual> but expected <expected> ✗ — retarget first."
    output_format:
      type: object
      properties:
        base_ok:
          type: string
          enum: ['true', 'false']
        actual_base: { type: string }
      required: [base_ok]

  # ---------------------------------------------------------------------------------------------
  # merge-gate — HITL by default; skipped in AFK. Only pauses when the base is verified good, so an
  # approval is never solicited for a merge that would be blocked anyway.
  # ---------------------------------------------------------------------------------------------
  - id: merge-gate
    depends_on: [verify-pr-base]
    when: "$bootstrap.output.gate == 'hitl' && $verify-pr-base.output.base_ok == 'true'"
    approval:
      message: >
        UAT approved and PR base verified as "$bootstrap.output.expected_base" for
        "$bootstrap.output.slug". Approve to merge the PR via the configured tracker (and delete the
        feature branch on Gitflow). Reject to halt without merging.

  # ---------------------------------------------------------------------------------------------
  # merge — merge the PR via the composed tracker. trigger_rule: all_done so it runs when merge-gate
  # is SKIPPED in AFK; the `when` fail-closes so it NEVER runs on a red e2e/coverage or a wrong base,
  # in either mode. A rejected merge-gate cancels the run before this node (max_attempts default).
  # ---------------------------------------------------------------------------------------------
  - id: merge
    depends_on: [merge-gate]
    trigger_rule: all_done
    when: "$e2e.output.result != 'fail' && $coverage-gate.output.result != 'fail' && $verify-pr-base.output.base_ok == 'true'"
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the merge node of /qa for slug "$bootstrap.output.slug".

      REPO_REF = $bootstrap.output.repo_ref

      Merge the open PR for the current feature branch, composing the tracker from
      `.archon/unic-dlc.config.yaml` (`tracker.type`, `project.pr_strategy`, `project.branching`;
      MCP-first, CLI-fallback — never hardcode a host, ADR-0016). PIN every call to REPO_REF — an
      unpinned CLI infers the repository from the checkout, which in a fork clone is the upstream parent,
      and this node MERGES. The reference is host-agnostic and only the FLAG differs:
        - github → `gh pr merge --repo "<REPO_REF>"` with `--squash` (default) or `--merge` per
          `project.pr_strategy`.
        - ado    → resolve the PR with `az repos pr list --repository "<REPO_REF>"` and complete it with
          `az repos pr update --id <id> --status completed`. Pass the repository through the flag the
          subcommand actually takes: `--repository` where one exists, `--id` where the PR identifies
          itself; add the `--organization` / `--project` coords from `tracker.coords` to both.
        - jira / local-markdown → print the manual steps (transition the linked issue to Done / set
          Status: resolved in the issues file) — there is no merge CLI.
      On Gitflow (`project.branching == "gitflow"`) with a git-hosted tracker (github/ado), after a
      successful merge: check out the base branch and delete the merged `feature/*` branch. On
      github-flow, leave branch cleanup to the host's auto-delete.

      Finally print: "merge: QA for \"$bootstrap.output.slug\" complete. ✓"
