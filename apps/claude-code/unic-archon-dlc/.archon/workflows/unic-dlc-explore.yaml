name: unic-dlc-explore
description: >
  Off-line, optional research + AFK-spike on-ramp. Parallel research (stack / features / architecture
  / pitfalls) → synthesize into <artifacts_dir>/<slug>/findings.md → one AFK spike (verdicts) → file a
  spike ticket → optionally preserve the spike code on a branch. findings.md is the /specs baton: its
  Integrated Brief carries three named lenses (Domain Model / Established Decisions / Prior Research)
  that /specs' load-context reads verbatim. Never required; a precursor to /specs, off the main line
  (PLAN decision #3/#8). Ported to the key-discriminated node schema (ADR-0011); self-contained prompt
  nodes, no plugin-lib import (ADR-0023 §5); artefacts at <artifacts_dir>/<slug>/ (ADR-0015). Interactive
  prototyping stays Matt's /prototype skill (referenced, never invoked — nodes have no live
  conversation). See ADR-0029.

# Required at the workflow level so the spike-branch approval message reaches the user (ADR-0011).
interactive: true

nodes:
  # ---------------------------------------------------------------------------------------------
  # bootstrap — parse the slug from $ARGUMENTS, read config. A prompt node (NOT a script) so it needs
  # no plugin-lib import and no $CLAUDE_PLUGIN_ROOT (ADR-0023 §5): the agent reads
  # .archon/unic-dlc.config.yaml with its own tools. No PRD precondition — /explore WRITES findings.md,
  # it is not a consumer of a prior baton.
  # ---------------------------------------------------------------------------------------------
  - id: bootstrap
    depends_on: []
    context: fresh
    allowed_tools: [Read, Bash, Glob]
    prompt: |
      You are the bootstrap node of the unic-archon-dlc /explore workflow.

      1. Parse the FIRST whitespace-delimited token of "$ARGUMENTS" as the slug. Validate it against
         the kebab-case pattern `^[a-z0-9]+(-[a-z0-9]+)*$`. If $ARGUMENTS is empty OR the token does
         not match → status "no-slug" with a `message` explaining the slug must be kebab-case (lower
         alphanumerics and single hyphens only) — this is a hard gate: the slug is later interpolated
         into branch names and shell commands, so a non-matching token is NEVER treated as ready.
      2. Read `.archon/unic-dlc.config.yaml` at the repo root.
         - If it is absent or unreadable → status "no-config".
         - Otherwise read:
             `artifacts_dir`        (default "workflows")
             `gates.explore`        (default "hitl")
             `tracker.type`         (e.g. github / ado / jira / local-markdown)
             `project.branching`    (default "gitflow")
             `project.repo_ref`     (OPTIONAL, may be absent or null)
      3. If slug and config are both present → status "ready".

      /explore has no PRD or findings precondition — it is an off-line precursor that PRODUCES
      findings.md, so `ready` needs only a slug + a readable config.

      `project.repo_ref` is the host-agnostic repository reference every tracker-touching node pins its
      CLI call to — "OWNER/REPO" (optionally "HOST/OWNER/REPO") for github, and the bare repository
      NAME for ado, whose `--repository` takes a name or ID with the project supplied separately from
      `tracker.coords`.
      Emit it VERBATIM as `repo_ref`, with no normalising, splitting or host-qualifying: only the
      consuming node knows which flag it belongs to. When the key is absent, null or empty, emit
      `repo_ref` "" and `repo_ref_present` "false"; otherwise emit the value and "true".
      `repo_ref_present` is the STRING "true"/"false" (an enum) so the `guard-no-repo-ref` condition
      compares it reliably.

      Emit ONLY the structured object. ALWAYS emit EVERY required field, including in the no-slug /
      no-config branches, so the object validates before `guard-not-ready` can cancel. When a value
      cannot be read, fall back to: slug "" (if no-slug), artifacts_dir "workflows", gate "hitl",
      tracker_type "", branching "gitflow", repo_ref "", repo_ref_present "false". Set `message` to a
      human-readable reason for any non-ready status.
    output_format:
      type: object
      properties:
        status:
          type: string
          enum: [ready, no-slug, no-config]
        slug: { type: string }
        artifacts_dir: { type: string }
        gate:
          type: string
          enum: [hitl, afk]
        tracker_type: { type: string }
        branching: { type: string }
        repo_ref: { type: string }
        repo_ref_present:
          type: string
          enum: ['true', 'false']
        message: { type: string }
      required: [status, slug, artifacts_dir, gate, tracker_type, repo_ref, repo_ref_present, message]

  # ---------------------------------------------------------------------------------------------
  # guard — expected precondition failures cancel cleanly (ADR-0011: cancel vs fail).
  # ---------------------------------------------------------------------------------------------
  - id: guard-not-ready
    depends_on: [bootstrap]
    when: "$bootstrap.output.status != 'ready'"
    cancel: >
      /explore preconditions not met — see the bootstrap output. Pass a kebab-case slug
      (`/unic-archon-dlc:explore <slug>`) and run /unic-archon-dlc:setup first so
      `.archon/unic-dlc.config.yaml` exists.

  # ---------------------------------------------------------------------------------------------
  # guard-no-repo-ref — an unpinned repository is an EXPECTED precondition failure, so it cancels
  # rather than fails (ADR-0011), exactly like guard-not-ready above. spike-ticket files a ticket
  # against the repository, and an unpinned `gh`/`az` call infers it from the checkout — which in a
  # fork clone is the upstream parent, so the ticket lands in someone else's tracker (#289).
  # ---------------------------------------------------------------------------------------------
  - id: guard-no-repo-ref
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready' && ($bootstrap.output.repo_ref_present == 'false' || $bootstrap.output.repo_ref == '')"
    cancel: >
      /explore cannot run: `project.repo_ref` is not set in `.archon/unic-dlc.config.yaml`. It is the
      repository every tracker call is pinned to — "OWNER/REPO" (or "HOST/OWNER/REPO") for github,
      the bare repository name for ado. Without it `gh`/`az` infers the repository from the checkout,
      which in a
      fork clone is the upstream parent. Add it under `project:` (or re-run /unic-archon-dlc:setup) and
      start /explore again.

  # ---------------------------------------------------------------------------------------------
  # research-stack — parallel research dimension 1 of 4. Read-only, fresh context. Emits its findings
  # as structured text so `synthesize` can compose them without re-deriving.
  # ---------------------------------------------------------------------------------------------
  - id: research-stack
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the research-stack node of /explore for slug "$bootstrap.output.slug".

      Goal: understand the technology stack of this project.

      Read `.archon/methods/research/SKILL.md` in full, by that literal repo-relative path — never
      `resolveMethod`, since an Archon node cannot import plugin `lib/` (ADR-0023 §5), so the config and
      `.local` override tiers do not apply here (ADR-0031). If it is missing that is FATAL for this node:
      print "research Method not found at .archon/methods/research/SKILL.md — run
      /unic-archon-dlc:setup" and stop. The Method opens by spinning up a background agent to do the
      reading; this node's own fresh-context execution IS that agent, so do not spawn another. Apply its
      primary-source discipline throughout the findings you emit: follow every factual claim back to the
      source that owns it — official docs, source code, specs, first-party APIs, or this repo's own
      files — and cite that source, never a secondary write-up of it.

      1. Read package.json (root and any workspace members listed in pnpm-workspace.yaml).
      2. Note the runtime, package manager, module system, and key devDependencies.
      3. Check .nvmrc or .node-version for the pinned Node.js version.
      4. Look for any framework, test runner, linter, or build tool references.

      Emit a concise Markdown body (no top-level heading — `synthesize` adds "## Stack Findings")
      covering: runtime version · package manager · module system (CJS/ESM) · key frameworks /
      libraries · toolchain (lint, format, type-check, test).
    output_format:
      type: object
      properties:
        findings: { type: string }
      required: [findings]

  # ---------------------------------------------------------------------------------------------
  # research-features — parallel research dimension 2 of 4.
  # ---------------------------------------------------------------------------------------------
  - id: research-features
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the research-features node of /explore for slug "$bootstrap.output.slug".

      Goal: identify the key features and capabilities of this project.

      Read `.archon/methods/research/SKILL.md` in full, by that literal repo-relative path — never
      `resolveMethod`, since an Archon node cannot import plugin `lib/` (ADR-0023 §5), so the config and
      `.local` override tiers do not apply here (ADR-0031). If it is missing that is FATAL for this node:
      print "research Method not found at .archon/methods/research/SKILL.md — run
      /unic-archon-dlc:setup" and stop. The Method opens by spinning up a background agent to do the
      reading; this node's own fresh-context execution IS that agent, so do not spawn another. Apply its
      primary-source discipline throughout the findings you emit: follow every factual claim back to the
      source that owns it — official docs, source code, specs, first-party APIs, or this repo's own
      files — and cite that source, never a secondary write-up of it.

      1. Read README.md (if present) for a high-level feature list.
      2. Scan the artefacts dir ("$bootstrap.output.artifacts_dir") and any tracker/issue docs for
         feature specs and slugs.
      3. Inspect any CHANGELOG.md files for shipped feature entries.
      4. Look at exported function names in lib/*.mjs (or the project's source dirs) to infer
         capabilities.

      Emit a concise Markdown body (no top-level heading — `synthesize` adds "## Features Findings")
      covering: core capabilities already shipped · in-progress or planned features · notable
      user-facing commands or workflows.
    output_format:
      type: object
      properties:
        findings: { type: string }
      required: [findings]

  # ---------------------------------------------------------------------------------------------
  # research-architecture — parallel research dimension 3 of 4. Also the primary source for the
  # Domain Model + Established Decisions lenses the synthesize node writes for /specs.
  # ---------------------------------------------------------------------------------------------
  - id: research-architecture
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the research-architecture node of /explore for slug "$bootstrap.output.slug".

      Goal: understand the structural and architectural decisions of this project.

      Read `.archon/methods/research/SKILL.md` in full, by that literal repo-relative path — never
      `resolveMethod`, since an Archon node cannot import plugin `lib/` (ADR-0023 §5), so the config and
      `.local` override tiers do not apply here (ADR-0031). If it is missing that is FATAL for this node:
      print "research Method not found at .archon/methods/research/SKILL.md — run
      /unic-archon-dlc:setup" and stop. The Method opens by spinning up a background agent to do the
      reading; this node's own fresh-context execution IS that agent, so do not spawn another. Apply its
      primary-source discipline throughout the findings you emit: follow every factual claim back to the
      source that owns it — official docs, source code, specs, first-party APIs, or this repo's own
      files — and cite that source, never a secondary write-up of it.

      1. Read CONTEXT.md and (if a monorepo) CONTEXT-MAP.md for the domain model and layering.
      2. Read docs/adr/ entries (newest five by filename) for recorded decisions.
      3. Examine the directory tree: source dirs, tests, hooks, .archon/, and any packages/.
      4. Identify patterns: pure functions vs. stateful modules, DAG/workflow orchestration,
         plugin conventions.
      5. Note any cross-platform constraints (Windows, macOS, Linux) visible in the code.

      Emit a concise Markdown body (no top-level heading — `synthesize` adds "## Architecture
      Findings") covering: directory structure and module responsibilities · key design patterns and
      conventions · recorded decisions from ADRs (cite ADR numbers) · cross-platform constraints.
    output_format:
      type: object
      properties:
        findings: { type: string }
      required: [findings]

  # ---------------------------------------------------------------------------------------------
  # research-pitfalls — parallel research dimension 4 of 4. (HANDOFF.md is retired — ADR-0013 — so it
  # is no longer a source here.)
  # ---------------------------------------------------------------------------------------------
  - id: research-pitfalls
    depends_on: [bootstrap]
    when: "$bootstrap.output.status == 'ready'"
    context: fresh
    allowed_tools: [Read, Bash, Glob, Grep]
    prompt: |
      You are the research-pitfalls node of /explore for slug "$bootstrap.output.slug".

      Goal: surface known pitfalls, edge cases, and areas of technical debt.

      Read `.archon/methods/research/SKILL.md` in full, by that literal repo-relative path — never
      `resolveMethod`, since an Archon node cannot import plugin `lib/` (ADR-0023 §5), so the config and
      `.local` override tiers do not apply here (ADR-0031). If it is missing that is FATAL for this node:
      print "research Method not found at .archon/methods/research/SKILL.md — run
      /unic-archon-dlc:setup" and stop. The Method opens by spinning up a background agent to do the
      reading; this node's own fresh-context execution IS that agent, so do not spawn another. Apply its
      primary-source discipline throughout the findings you emit: follow every factual claim back to the
      source that owns it — official docs, source code, specs, first-party APIs, or this repo's own
      files — and cite that source, never a secondary write-up of it.

      1. Search for TODO, FIXME, HACK, and XXX comments across all source files.
      2. Look for error-handling gaps: try/catch blocks that swallow errors, unhandled rejections.
      3. Check CI configuration (.github/workflows/ or .gitlab-ci.yml) for flaky or skipped jobs.
      4. Inspect test coverage: are there source modules with no corresponding test file?

      Emit a concise Markdown body (no top-level heading — `synthesize` adds "## Pitfalls Findings")
      covering: known bugs or TODOs · untested modules or coverage gaps · CI issues or flaky
      behaviours · risks worth flagging before a spec is written.
    output_format:
      type: object
      properties:
        findings: { type: string }
      required: [findings]

  # ---------------------------------------------------------------------------------------------
  # synthesize — depends on all four research nodes; writes <artifacts_dir>/<slug>/findings.md directly
  # with the Write tool (ADR-0023 §5 — no findings-writer lib). The Integrated Brief is written as THREE
  # explicitly-named lenses (Domain Model / Established Decisions / Prior Research) that /specs'
  # load-context reads verbatim (ADR-0029) — this is the /explore → /specs contract.
  # ---------------------------------------------------------------------------------------------
  - id: synthesize
    depends_on: [research-stack, research-features, research-architecture, research-pitfalls]
    context: fresh
    allowed_tools: [Read, Write, Glob]
    prompt: |
      You are the synthesize node of /explore for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        Findings path = <ARTIFACTS_DIR>/<SLUG>/findings.md

      You have four research outputs:
        - stack        = $research-stack.output.findings
        - features     = $research-features.output.findings
        - architecture = $research-architecture.output.findings
        - pitfalls     = $research-pitfalls.output.findings

      Also read, if present: root CONTEXT.md / CONTEXT-MAP.md and docs/adr/ — they carry the canonical
      domain vocabulary and the decisions already recorded.

      Create the directory <ARTIFACTS_DIR>/<SLUG>/ if needed, then WRITE <ARTIFACTS_DIR>/<SLUG>/
      findings.md with EXACTLY this structure (idempotent — overwrite if it already exists):

        # Explore findings — <SLUG>

        _Generated by unic-archon-dlc /explore._

        ## Integrated Brief

        ### Domain Model
        <the ubiquitous-language terms + bounded contexts this feature touches, drawn from CONTEXT.md
         and the architecture research. This is what /specs reads as its "Domain Model" lens.>

        ### Established Decisions
        <decisions already locked in — cite the relevant ADR numbers and any convention the spec must
         respect. This is what /specs reads as its "Established Decisions" lens.>

        ### Prior Research
        <a 3-5 sentence synthesis across all four dimensions: the most important insight from each, any
         cross-cutting concern, the single highest-impact next step, and the OPEN QUESTIONS a spec must
         resolve. This is what /specs reads as its "Prior Research" lens.>

        ## Stack Findings
        <stack body>

        ## Features Findings
        <features body>

        ## Architecture Findings
        <architecture body>

        ## Pitfalls Findings
        <pitfalls body>

      Then print: "Explore synthesize complete. Findings written to <ARTIFACTS_DIR>/<SLUG>/findings.md"

  # ---------------------------------------------------------------------------------------------
  # spike — one AFK experiment pass. Build/measure a throwaway experiment where AFK-feasible, else
  # reason it through; assign exactly one verdict per unknown and APPEND a "## Spike verdicts" section
  # to findings.md (Edit/Write — no spike-verdicts lib). Interactive prototyping is NOT done here — it
  # is Matt's /prototype skill, which needs a live conversation and so cannot run in an Archon node
  # (ADR-0017/0029). This node only references it.
  # ---------------------------------------------------------------------------------------------
  - id: spike
    depends_on: [synthesize]
    context: fresh
    allowed_tools: [Read, Write, Edit, Bash, Glob, Grep]
    prompt: |
      You are the spike node of /explore for slug "$bootstrap.output.slug". You run AFK — no live human.

      Constants:
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        Findings path = <ARTIFACTS_DIR>/<$bootstrap.output.slug>/findings.md

      1. Read findings.md. From the Integrated Brief (Prior Research open questions) and Pitfalls,
         pick 1-3 concrete unknowns worth spiking.
      2. For each unknown, run a MINIMAL experiment:
           - Give it a short descriptive title.
           - Where an experiment can be built or measured non-interactively, DO SO (throwaway code,
             clearly marked, no persistence, no polish — delete or leave it in this isolated worktree).
             Where a live UI/UX judgement is required, DO NOT build it here — note that it needs Matt's
             `/prototype` skill (interactive) and reason through the most likely outcome instead.
           - Assign exactly ONE verdict: VALIDATED | INVALIDATED | PARTIAL.
             · VALIDATED   — approach confirmed viable; evidence sufficient.
             · INVALIDATED — approach ruled out; a blocker was found.
             · PARTIAL     — promising but needs follow-up (e.g. interactive /prototype).
           - Write 2-4 sentences of supporting evidence.
      3. Write a "## Spike verdicts" section to findings.md, one subsection per unknown:
           ## Spike verdicts
           ### <title> — <VALIDATED|INVALIDATED|PARTIAL>
           <evidence>
         Be IDEMPOTENT: if a "## Spike verdicts" section already exists (e.g. this node is re-run),
         REPLACE it in place — never append a second one. Do not disturb the sections synthesize
         wrote above it.
      4. Emit a one-line `verdict_summary` like "1 VALIDATED, 1 PARTIAL" and print:
         "Spike complete. <N> verdict(s) written to findings.md. (Interactive prototyping → Matt's
          /prototype.)"
    output_format:
      type: object
      properties:
        verdict_summary: { type: string }
      required: [verdict_summary]

  # ---------------------------------------------------------------------------------------------
  # spike-ticket — file (or update) a spike ticket in the configured tracker. Runs BEFORE the branch
  # gate so the durable output survives a "discard" (the approval schema only supports on_reject, which
  # cancels/reworks — it never proceeds past a reject). Composes the tracker MCP-first/CLI-fallback and
  # takes labels ONLY from classification.labels (single source of truth — ADR-0024), never a
  # labels-config lib and never Matt's docs/agents/*.
  # ---------------------------------------------------------------------------------------------
  - id: spike-ticket
    depends_on: [spike]
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the spike-ticket node of /explore for slug "$bootstrap.output.slug".

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir
        TRACKER       = $bootstrap.output.tracker_type
        REPO_REF      = $bootstrap.output.repo_ref
        Verdicts      = $spike.output.verdict_summary

      ## Repo-pinning rule (applies to EVERY tracker call in this node)
      Pin every call to REPO_REF — never let the CLI infer the repository from the checkout, which in a
      fork clone resolves to the upstream parent and files the ticket in someone else's tracker. The
      reference is host-agnostic and the FLAG is what differs, so pass it per host and never hardcode
      one (ADR-0016):
        - github → `gh issue create --repo "<REPO_REF>" …` (and `--repo` on every `gh issue list` /
          `gh issue edit` / `gh api` call this node makes)
        - ado    → `az repos …` with `--repository "<REPO_REF>"` (plus the `--organization` /
          `--project` coords from `tracker.coords`)
        - jira / local-markdown → no repository flag exists; use the configured coords as-is.
      REPO_REF is guaranteed non-empty here: `guard-no-repo-ref` cancelled the run otherwise.

      If a pinned call FAILS, STOP and report the exact command and its error. Do NOT retry the
      call without the pin, and do NOT split, reshape or host-qualify REPO_REF to make it pass: an
      unpinned retry acts on whatever repository the checkout infers, which is the defect this pin
      exists to prevent (#289). A wrong `project.repo_ref` is the operator's to fix, not yours.

      1. Read `.archon/unic-dlc.config.yaml` for `tracker` (type / access / coords) and
         `classification.labels`. Compose the tracker MCP-first, CLI-fallback (gh / az / jira, or the
         azure-devops-cli skill) — never hardcode a host (ADR-0016). Labels come ONLY from
         `classification.labels` (single source of truth — ADR-0024); do NOT read
         docs/agents/triage-labels.md or issue-tracker.md.
      2. Check whether a spike ticket for this SLUG already exists (search the tracker by title/label
         containing the slug; for local-markdown check the issues dir). Be idempotent.
      3a. If NONE exists → create a ticket:
            - Title: "Spike: <SLUG> — <Verdicts>"
            - Labels: type `spike` + a low priority (resolved through classification.labels).
            - Body: link to <ARTIFACTS_DIR>/<SLUG>/findings.md, then the full "## Spike verdicts"
              section text.
            - Prepend the mandated disclaimer as the first body line:
              `> *This was generated by AI during exploration.*`
      3b. If one EXISTS → append the new `<Verdicts>` summary to its body and (re)set its triage/state
          label per classification.labels.
      4. For jira / local-markdown or any tracker without a create CLI, print the composed command /
         manual steps instead of failing.
      5. Print one of: "Spike ticket created: <title>" / "Spike ticket updated: <id>".

  # ---------------------------------------------------------------------------------------------
  # spike-branch-gate — HITL by default (gates.explore); skipped in AFK. APPROVE → proceed to
  # preserve-spike (creates the branch). REJECT → the run ends here (spike-ticket already filed); no
  # on_reject, so a reject cancels cleanly rather than looping. In AFK the gate is skipped and
  # preserve-spike is skipped with it — no branch, the isolated worktree is left for /cleanup.
  # ---------------------------------------------------------------------------------------------
  - id: spike-branch-gate
    depends_on: [spike-ticket]
    when: "$bootstrap.output.gate == 'hitl'"
    approval:
      message: >
        Exploration "$bootstrap.output.slug" is complete and the spike ticket is filed. Preserve the
        spike code on a dedicated branch? APPROVE → I create branch spike/$bootstrap.output.slug and
        commit the worktree changes. REJECT → no branch; the spike code stays uncommitted in this
        isolated worktree (/cleanup prunes it later).

  # ---------------------------------------------------------------------------------------------
  # preserve-spike — reached ONLY on approve (a rejected gate cancels the run before here). `when`
  # gates.explore == 'hitl' also skips it in AFK, where the gate is skipped and skip propagates.
  # ---------------------------------------------------------------------------------------------
  - id: preserve-spike
    depends_on: [spike-branch-gate]
    when: "$bootstrap.output.gate == 'hitl'"
    context: fresh
    allowed_tools: [Read, Bash]
    prompt: |
      You are the preserve-spike node of /explore for slug "$bootstrap.output.slug". The reviewer
      approved preserving the spike code.

      Constants:
        SLUG          = $bootstrap.output.slug
        ARTIFACTS_DIR = $bootstrap.output.artifacts_dir

      1. Create the branch (quote the branch name — the slug is user-controlled):
           git checkout -b "spike/$bootstrap.output.slug"

      2. Stage the spike BY NAME. This node never stages blindly: `git add -A`, `git add --all`,
         `git add .`, `git add -u` and `git commit -a`/`-am` are FORBIDDEN here. It runs in an isolated worktree that also carries the
         operator's copied `.archon/` directory, scratch files the research and spike nodes produced,
         and whatever an experiment left on disk — so "everything changed" is not the spike, and a
         blind add lands scratch and PR-body artefacts on the branch.
           a. List the candidates: `git status --porcelain`
           b. Build the stage list from that output, keeping ONLY:
                - <ARTIFACTS_DIR>/<SLUG>/findings.md
                - the throwaway experiment files the spike node created for this SLUG
           c. NEVER stage, whatever `git status` reports:
                - `pr-body.md`, or any `*.tmp.md` / `*.scratch.md`
                - anything under `$ARTIFACTS_DIR` — Archon's per-run directory, which resolves OUTSIDE
                  the repo tree and is NOT the config's `artifacts_dir`
                - anything under `.archon/` — the operator's workflows and commands, copied into this
                  worktree before the run started; they are never this node's changes to commit
           d. Stage each kept path individually and quoted:
                git add -- "<path>" "<path>" …
           e. PROVE it: run `git status --porcelain` again and confirm every staged entry (first
              column) is a path you named in (b). Unstage anything else with
              `git restore --staged -- "<path>"` and re-check before committing.

      3. Commit:
           git commit -m "spike($bootstrap.output.slug): preserve exploration artifacts from /explore"

      4. Print: "Spike code committed on branch spike/$bootstrap.output.slug."
