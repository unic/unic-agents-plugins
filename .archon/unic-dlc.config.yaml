project:
  name: unic-agents-plugins
  repo_layout: multi-context
  branching: gitflow
  pr_strategy: merge
tracker:
  type: github
  access:
    mcp: null
    cli: gh
  coords:
    owner: unic
    repo: unic-agents-plugins
docs:
  type: markdown
  publish: false
  access:
    mcp: null
    cli: null
design:
  type: none
  access:
    mcp: null
repos: []
templates:
  prd: null
  issue: null
  bug: null
classification:
  labels:
    state:
      needs-triage: needs-triage
      needs-info: needs-info
      needs-specs: needs-specs
      ready-for-agent: ready-for-agent
      ready-for-human: ready-for-human
      resolved: resolved
      closed: closed
      rejected: rejected
    type:
      feature: feature
      bug: bug
      spike: spike
      tech-debt: tech-debt
      docs: docs
      release: release
    priority:
      p0: p0
      p1: p1
      p2: p2
      p3: p3
gates:
  build: hitl
  qa: hitl
  pr-review: hitl
  explore: hitl
build:
  fresh_context_red_green: true
  tdd_mode: true
  nyquist_validation: true
  slopsquatting_gate: true
  e2e_command: null
  coverage_threshold: null
estimations: off
artifacts_dir: workflows
model_profile: balanced
methods: {}
