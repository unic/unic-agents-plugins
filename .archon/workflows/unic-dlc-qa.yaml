name: unic-dlc-qa
description: >
  QA workflow: e2e test execution → coverage gate → UAT checklist → merge.
  Runs after the build workflow is complete and the build PR has been approved.

inputs:
  slug:
    description: Planning session identifier — matches the slug used in /unic-dlc-plan and /unic-dlc-build.
    required: true

nodes:
  - id: e2e
    name: End-to-End Tests
    type: bash
    runtime: bun
    depends_on: []
    script: |
      #!/usr/bin/env node
      // @ts-check
      import { execFileSync } from 'node:child_process'
      import { existsSync, readFileSync } from 'node:fs'
      import { join } from 'node:path'

      const projectDir = process.cwd()
      const configPath = join(projectDir, '.archon', 'unic-dlc.config.json')

      if (!existsSync(configPath)) {
        console.error('e2e: .archon/unic-dlc.config.json not found.')
        console.error('Run the install hook first: archon install')
        process.exit(1)
      }

      const config = JSON.parse(readFileSync(configPath, 'utf8'))
      const e2eCommand = config.e2e_command ?? null

      if (!e2eCommand) {
        console.error('e2e: e2e_command is not configured.')
        console.error('')
        console.error('To set it, run the install hook with --reconfigure:')
        console.error('  archon install --reconfigure')
        console.error('and provide a value for "e2e_command" (e.g. "pnpm test:e2e" or "npx playwright test").')
        process.exit(1)
      }

      const parts = e2eCommand.trim().split(/\s+/)
      const cmd = parts[0]
      const args = parts.slice(1)

      console.log(`e2e: running → ${e2eCommand}`)
      console.log('')

      try {
        execFileSync(cmd, args, { cwd: projectDir, stdio: 'inherit' })
        console.log('')
        console.log('e2e: PASSED ✓')
      } catch {
        console.error('')
        console.error('e2e: FAILED ✗')
        process.exit(1)
      }

  - id: coverage-gate
    name: Coverage Gate
    type: bash
    runtime: bun
    depends_on: [e2e]
    script: |
      #!/usr/bin/env node
      // @ts-check
      import { execFileSync } from 'node:child_process'
      import { existsSync, readFileSync } from 'node:fs'
      import { join } from 'node:path'

      const projectDir = process.cwd()
      const configPath = join(projectDir, '.archon', 'unic-dlc.config.json')

      let coverageThreshold = null
      if (existsSync(configPath)) {
        const config = JSON.parse(readFileSync(configPath, 'utf8'))
        coverageThreshold = config.coverage_threshold ?? null
      }

      if (coverageThreshold === null) {
        console.log('coverage-gate: no coverage_threshold configured — skipping.')
        console.log('To enable, add "coverage_threshold": <number> to .archon/unic-dlc.config.json.')
        process.exit(0)
      }

      console.log(`coverage-gate: threshold is ${coverageThreshold}%`)
      console.log('coverage-gate: running test suite with coverage...')
      console.log('')

      // Run tests with coverage; capture output to parse coverage percentage
      let coverageOutput = ''
      let failed = false
      try {
        coverageOutput = execFileSync('pnpm', ['test', '--coverage'], {
          cwd: projectDir,
          encoding: 'utf8',
          stdio: ['inherit', 'pipe', 'pipe'],
        })
        process.stdout.write(coverageOutput)
      } catch (/** @type {any} */ err) {
        if (err.stdout) process.stdout.write(err.stdout)
        if (err.stderr) process.stderr.write(err.stderr)
        coverageOutput = (err.stdout ?? '') + (err.stderr ?? '')
        failed = true
      }

      // Attempt to extract a coverage percentage from the output.
      // Handles common formats: "All files | 87.5 |", "Stmts: 87.5%", "87.5% statements"
      const percentMatch =
        coverageOutput.match(/All files\s*\|\s*([\d.]+)/) ??
        coverageOutput.match(/Stmts\s*[:\|]\s*([\d.]+)/) ??
        coverageOutput.match(/([\d.]+)%\s+statements/i)

      if (percentMatch) {
        const actual = parseFloat(percentMatch[1])
        if (actual < coverageThreshold) {
          console.error(`\ncoverage-gate: FAILED (${actual}% < threshold ${coverageThreshold}%)`)
          process.exit(1)
        }
        console.log(`\ncoverage-gate: PASSED (${actual}%)`)
      } else if (failed) {
        // Could not parse percentage but the command failed
        console.error(`\ncoverage-gate: FAILED (test suite exited non-zero; threshold ${coverageThreshold}%)`)
        process.exit(1)
      } else {
        // Command passed but no parseable percentage — treat as passed with a warning
        console.log(`\ncoverage-gate: PASSED (coverage % could not be parsed; threshold ${coverageThreshold}%)`)
      }

  - id: uat-gate
    name: UAT Gate — Acceptance Checklist
    type: interactive
    fresh_context: true
    depends_on: [coverage-gate]
    prompt: |
      You are running the unic-archon-dlc QA workflow — uat-gate node.

      Goal: walk through the UAT checklist derived from the PRD's acceptance criteria alongside
      the e2e results, then get human sign-off before the merge step proceeds.

      ## Step 1 — Load artefacts

      1. Read `docs/workflow/{{ inputs.slug }}/PRD.md`.
         Extract all acceptance criteria. They are typically found in:
           - Each "User Story" block as sub-bullet "Acceptance criteria:" lists.
           - A top-level "## Acceptance Criteria" section if present.
         Number each criterion sequentially: AC-1, AC-2, …

      2. Check whether `docs/workflow/{{ inputs.slug }}/report.md` exists and read it if so.
         The report contains the goals-check coverage matrix and test outcomes from the build phase.

      ## Step 2 — Present the UAT checklist

      Print the following header:

        === UAT Checklist for {{ inputs.slug }} ===

      Then for each acceptance criterion:

        AC-N: <criterion text>
          Evidence: <matching row from coverage matrix, or "not recorded">
          [ ] Verified by human

      Follow the list with:

        e2e result: PASSED  (or FAILED — see e2e node output above)
        Coverage:   PASSED  (or SKIPPED / FAILED — see coverage-gate output above)

      ## Step 3 — Ask for sign-off

      Ask the user:
        "Please review each item above and confirm:
         1. All acceptance criteria are verified (tick each [ ] mentally or note any failures).
         2. You approve this build for merge.

         Type APPROVE to continue to the merge step.
         Type REJECT <AC-N> to flag a failing checklist item — I will return control to whoever
         owns that item for remediation."

      ## Step 4 — Act on the response

      If the user types APPROVE (case-insensitive):
        Print: "uat-gate: APPROVED. Proceeding to merge."

      If the user types REJECT <AC-N> (or REJECT with any text):
        Print: "uat-gate: REJECTED — {{ user response }}."
        Print: "Returning control. Address the failing criterion and re-run /unic-dlc-qa {{ inputs.slug }} to retry."
        Halt the workflow (do not proceed to the merge node).

  - id: verify-pr-base
    name: Verify PR Base Branch
    type: bash
    runtime: bun
    depends_on: [uat-gate]
    script: |
      #!/usr/bin/env node
      // @ts-check
      import { readFileSync } from 'node:fs'
      import { execFileSync } from 'node:child_process'

      let config = {}
      try {
        config = JSON.parse(readFileSync('.archon/unic-dlc.config.json', 'utf8'))
      } catch {
        console.error('verify-pr-base: cannot read .archon/unic-dlc.config.json')
        process.exit(1)
      }

      const tracker = config.tracker ?? 'github'
      const branching = config.branching ?? 'gitflow'
      const expectedBase = branching === 'gitflow' ? 'develop' : 'main'

      if (tracker === 'github') {
        let actualBase
        try {
          const out = execFileSync('gh', ['pr', 'view', '--json', 'baseRefName'], { encoding: 'utf8' })
          actualBase = JSON.parse(out).baseRefName
        } catch (err) {
          console.error(`verify-pr-base: cannot query PR base — ${err.message}`)
          process.exit(1)
        }
        if (actualBase !== expectedBase) {
          console.error(
            `verify-pr-base: PR targets "${actualBase}" but expected "${expectedBase}" (branching: ${branching}).`,
          )
          console.error('  Retarget the PR before merging.')
          process.exit(1)
        }
        console.log(`verify-pr-base: PR base is "${actualBase}" ✓`)
      } else if (tracker === 'ado') {
        let actualBase
        try {
          const out = execFileSync('az', ['repos', 'pr', 'show', '--output', 'json'], { encoding: 'utf8' })
          actualBase = JSON.parse(out).targetRefName?.replace('refs/heads/', '')
        } catch (err) {
          console.error(`verify-pr-base: cannot query ADO PR — ${err.message}`)
          process.exit(1)
        }
        if (actualBase !== expectedBase) {
          console.error(
            `verify-pr-base: PR targets "${actualBase}" but expected "${expectedBase}" (branching: ${branching}).`,
          )
          process.exit(1)
        }
        console.log(`verify-pr-base: PR base is "${actualBase}" ✓`)
      } else {
        // Jira / local-markdown — no CLI to query PR base
        console.log(
          `verify-pr-base: tracker "${tracker}" does not support PR base verification. Skipping (warning only).`,
        )
      }

  - id: merge
    name: Merge PR
    type: bash
    runtime: bun
    depends_on: [verify-pr-base]
    script: |
      #!/usr/bin/env node
      // @ts-check
      import { execFileSync } from 'node:child_process'
      import { existsSync, readFileSync } from 'node:fs'
      import { join } from 'node:path'

      const projectDir = process.cwd()
      const configPath = join(projectDir, '.archon', 'unic-dlc.config.json')

      if (!existsSync(configPath)) {
        console.error('merge: .archon/unic-dlc.config.json not found.')
        process.exit(1)
      }

      const config = JSON.parse(readFileSync(configPath, 'utf8'))
      const tracker = config.tracker ?? 'github'
      const branching = config.branching ?? 'gitflow'
      const prStrategy = config.pr_strategy ?? 'squash'
      const slug = process.env.ARCHON_INPUT_SLUG ?? ''

      console.log(`merge: tracker=${tracker}, branching=${branching}, pr_strategy=${prStrategy}`)
      console.log('')

      // Merge via the configured tracker
      switch (tracker) {
        case 'github': {
          const mergeFlag = prStrategy === 'merge' ? '--merge' : '--squash'
          console.log(`merge: running gh pr merge ${mergeFlag}`)
          try {
            execFileSync('gh', ['pr', 'merge', mergeFlag], { cwd: projectDir, stdio: 'inherit' })
            console.log('merge: PR merged successfully via GitHub CLI.')
          } catch {
            console.error('merge: gh pr merge failed. Ensure you are on a feature branch with an open PR.')
            process.exit(1)
          }
          break
        }

        case 'ado': {
          console.log('merge: running az repos pr update --status completed')
          try {
            execFileSync('az', ['repos', 'pr', 'update', '--status', 'completed'], {
              cwd: projectDir,
              stdio: 'inherit',
            })
            console.log('merge: PR completed successfully via Azure DevOps CLI.')
          } catch {
            console.error('merge: az repos pr update failed. Ensure the Azure DevOps PR is open and the CLI is authenticated.')
            process.exit(1)
          }
          break
        }

        case 'jira':
          console.log('Merge via Jira: transition the linked PR to Done manually.')
          console.log('  1. Open the Jira issue linked to this feature.')
          console.log('  2. Transition it to "Done" (or "In Review → Done" depending on your board).')
          console.log('  3. Merge the corresponding PR in your VCS provider.')
          break

        case 'local-markdown':
          console.log('Merge: update Status in issues to resolved.')
          console.log(`  Edit docs/issues/<slug>/index.md and set: Status: resolved`)
          console.log('  Then commit and push the change manually.')
          break

        default:
          console.log(`merge: unknown tracker "${tracker}". Merge the PR manually in your tracker.`)
          break
      }

      // Delete feature branch after merge when using Gitflow
      if (branching === 'gitflow' && (tracker === 'github' || tracker === 'ado')) {
        console.log('')
        console.log('merge: Gitflow — deleting feature branch...')
        try {
          // Determine current branch name
          const currentBranch = execFileSync('git', ['rev-parse', '--abbrev-ref', 'HEAD'], {
            cwd: projectDir,
            encoding: 'utf8',
          }).trim()

          if (currentBranch.startsWith('feature/')) {
            // Switch to develop before deleting
            execFileSync('git', ['checkout', 'develop'], { cwd: projectDir, stdio: 'inherit' })
            execFileSync('git', ['branch', '-d', currentBranch], { cwd: projectDir, stdio: 'inherit' })
            console.log(`merge: feature branch "${currentBranch}" deleted. ✓`)
          } else {
            console.log(`merge: current branch "${currentBranch}" is not a feature branch — skipping delete.`)
          }
        } catch {
          console.log('merge: could not delete feature branch automatically — delete it manually if needed.')
        }
      } else if (branching !== 'gitflow') {
        console.log('')
        console.log('merge: github-flow — leaving branch cleanup to GitHub (auto-delete on merge).')
      }

      console.log('')
      console.log(`merge: QA workflow for "${slug}" complete. ✓`)
